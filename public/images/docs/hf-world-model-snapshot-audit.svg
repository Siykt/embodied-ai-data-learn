<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">世界模型仓库核验流程</title><desc id="desc">使用前依次检查仓库版本与许可、输入输出和时间对齐、真实轨迹配对、分组留出和闭环结果。</desc>
<rect width="1200" height="500" rx="28" fill="#f5f7fb"/><text x="600" y="64" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#15223b">从 Hub 资源到可用数据的核验流程</text>
<g font-family="sans-serif" text-anchor="middle"><g fill="#fff" stroke="#d3dceb" stroke-width="2"><rect x="48" y="146" width="198" height="166" rx="20"/><rect x="285" y="146" width="198" height="166" rx="20"/><rect x="522" y="146" width="198" height="166" rx="20"/><rect x="759" y="146" width="198" height="166" rx="20"/><rect x="996" y="146" width="158" height="166" rx="20"/></g>
<g font-size="19" font-weight="700" fill="#175b9d"><text x="147" y="190">1 · 固定仓库</text><text x="384" y="190">2 · 核对许可</text><text x="621" y="190">3 · 对齐时序</text><text x="858" y="190">4 · 配对真值</text><text x="1075" y="190">5 · 评估</text></g>
<g font-size="15" fill="#53627a"><text x="147" y="231"><tspan x="147">repo + revision</tspan><tspan x="147" dy="24">文件与依赖</tspan></text><text x="384" y="231"><tspan x="384">许可证</tspan><tspan x="384" dy="24">来源与用途</tspan></text><text x="621" y="231"><tspan x="621">观测和动作时间</tspan><tspan x="621" dy="24">帧率 / 控制频率</tspan></text><text x="858" y="231"><tspan x="858">预测后态</tspan><tspan x="858" dy="24">真实执行轨迹</tspan></text><text x="1075" y="231"><tspan x="1075">预测误差</tspan><tspan x="1075" dy="24">闭环成功率</tspan></text></g></g>
<g stroke="#8294ad" stroke-width="4"><path d="M246 229h31"/><path d="M483 229h31"/><path d="M720 229h31"/><path d="M957 229h31"/></g><g fill="#8294ad"><path d="M276 221l14 8-14 8z"/><path d="M513 221l14 8-14 8z"/><path d="M750 221l14 8-14 8z"/><path d="M987 221l14 8-14 8z"/></g>
