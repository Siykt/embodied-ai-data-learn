<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">传感器接口统一后仍保留原始差异</title>
<desc id="desc">可变相机集合、人体佩戴标定和异质感官语义各自保持原始来源，进入模型接口时保留缺失和推断信息。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs>
<rect width="1200" height="590" rx="20" fill="#f8fafc"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="44" y="51" font-size="28" font-weight="700" fill="#0f172a">传感器接口统一后仍保留原始差异</text>
<text x="44" y="83" font-size="16" fill="#475569">2026 年 10 月 · 数据组织示意 · 字段及验收为本站建议</text>
<rect x="40" y="115" width="340" height="326" rx="14" fill="white" stroke="#cbd5e1"/>
