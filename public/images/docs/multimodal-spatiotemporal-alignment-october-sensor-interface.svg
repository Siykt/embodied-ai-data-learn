<text x="78" y="258" font-size="18" fill="#1e293b">camera_id + 位姿时刻</text>
<circle cx="63" cy="295" r="4" fill="#0f766e"/>
<text x="78" y="301" font-size="18" fill="#1e293b">逐帧有效视角掩码</text>
