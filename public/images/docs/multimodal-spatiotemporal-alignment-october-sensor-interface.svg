<text x="78" y="344" font-size="18" fill="#1e293b">腕部运动视角采样</text>
<circle cx="63" cy="381" r="4" fill="#0f766e"/>
<text x="78" y="387" font-size="18" fill="#1e293b">测试未见位姿与数量</text>
<rect x="430" y="115" width="340" height="326" rx="14" fill="white" stroke="#cbd5e1"/>
<rect x="430" y="115" width="340" height="61" rx="14" fill="#1d4ed8"/>
<text x="450" y="154" font-size="23" font-weight="650" fill="white">人体佩戴</text>
