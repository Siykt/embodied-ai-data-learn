<text x="61" y="503" font-size="20" font-weight="600" fill="#0f172a">共享表示必须携带：来源、标定版本、时间戳、缺失与推断掩码</text>
<text x="61" y="535" font-size="18" fill="#334155">语义上能共同理解，不代表不同传感器已同步记录同一物理事件</text>
