<circle cx="453" cy="252" r="4" fill="#1d4ed8"/>
<text x="468" y="258" font-size="18" fill="#1e293b">参与者几何</text>
<circle cx="453" cy="295" r="4" fill="#1d4ed8"/>
<text x="468" y="301" font-size="18" fill="#1e293b">安装变换 / 标定会话</text>
<circle cx="453" cy="338" r="4" fill="#1d4ed8"/>
<text x="468" y="344" font-size="18" fill="#1e293b">实测关节与补全关节</text>
<circle cx="453" cy="381" r="4" fill="#1d4ed8"/>
<text x="468" y="387" font-size="18" fill="#1e293b">重新佩戴单独验收</text>
<rect x="820" y="115" width="340" height="326" rx="14" fill="white" stroke="#cbd5e1"/>
<rect x="820" y="115" width="340" height="61" rx="14" fill="#7e22ce"/>
<text x="840" y="154" font-size="23" font-weight="650" fill="white">异质感官</text>
<text x="840" y="211" font-size="19" font-weight="600" fill="#7e22ce">单位与语义先对应</text>
<circle cx="843" cy="252" r="4" fill="#7e22ce"/>
