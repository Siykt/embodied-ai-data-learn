<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">YUV 4:2:0 plane layout</title>
  <desc id="desc">Y plane stores full resolution luma, while U and V chroma planes store half width and half height samples. Android YUV_420_888 exposes row stride and pixel stride for every plane.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fb}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.cell-y{fill:#dbeafe;stroke:#2563eb}.cell-u{fill:#dcfce7;stroke:#16a34a}.cell-v{fill:#fee2e2;stroke:#dc2626}.txt{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.muted{fill:#475569}.small{font-size:18px}.label{font-size:24px;font-weight:700}.note{font-size:16px}.arrow{stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="520"/>
  <text class="txt label" x="48" y="54">YUV 4:2:0: luma dense, chroma shared</text>
  <text class="txt small muted" x="48" y="86">Four neighboring Y samples share one U and one V sample. This reduces bandwidth while preserving most spatial detail.</text>

  <rect class="panel" x="46" y="124" width="392" height="334" rx="8"/>
  <text class="txt label" x="72" y="164">Y plane</text>
  <text class="txt note muted" x="72" y="190">width x height, pixelStride = 1 in Android YUV_420_888</text>
  <g transform="translate(72 220)">
    <rect class="cell-y" x="0" y="0" width="42" height="42"/><rect class="cell-y" x="46" y="0" width="42" height="42"/><rect class="cell-y" x="92" y="0" width="42" height="42"/><rect class="cell-y" x="138" y="0" width="42" height="42"/><rect class="cell-y" x="184" y="0" width="42" height="42"/><rect class="cell-y" x="230" y="0" width="42" height="42"/>
    <rect class="cell-y" x="0" y="46" width="42" height="42"/><rect class="cell-y" x="46" y="46" width="42" height="42"/><rect class="cell-y" x="92" y="46" width="42" height="42"/><rect class="cell-y" x="138" y="46" width="42" height="42"/><rect class="cell-y" x="184" y="46" width="42" height="42"/><rect class="cell-y" x="230" y="46" width="42" height="42"/>
    <rect class="cell-y" x="0" y="92" width="42" height="42"/><rect class="cell-y" x="46" y="92" width="42" height="42"/><rect class="cell-y" x="92" y="92" width="42" height="42"/><rect class="cell-y" x="138" y="92" width="42" height="42"/><rect class="cell-y" x="184" y="92" width="42" height="42"/><rect class="cell-y" x="230" y="92" width="42" height="42"/>
    <rect class="cell-y" x="0" y="138" width="42" height="42"/><rect class="cell-y" x="46" y="138" width="42" height="42"/><rect class="cell-y" x="92" y="138" width="42" height="42"/><rect class="cell-y" x="138" y="138" width="42" height="42"/><rect class="cell-y" x="184" y="138" width="42" height="42"/><rect class="cell-y" x="230" y="138" width="42" height="42"/>
  </g>

  <rect class="panel" x="520" y="124" width="392" height="334" rx="8"/>
  <text class="txt label" x="546" y="164">U / V planes</text>
  <text class="txt note muted" x="546" y="190">width/2 x height/2, planar or semi-planar</text>
  <g transform="translate(548 232)">
    <rect class="cell-u" x="0" y="0" width="58" height="58"/><rect class="cell-u" x="66" y="0" width="58" height="58"/><rect class="cell-u" x="132" y="0" width="58" height="58"/>
    <rect class="cell-u" x="0" y="66" width="58" height="58"/><rect class="cell-u" x="66" y="66" width="58" height="58"/><rect class="cell-u" x="132" y="66" width="58" height="58"/>
    <text class="txt small" x="68" y="154">U</text>
  </g>
  <g transform="translate(728 232)">
    <rect class="cell-v" x="0" y="0" width="58" height="58"/><rect class="cell-v" x="66" y="0" width="58" height="58"/><rect class="cell-v" x="132" y="0" width="58" height="58"/>
    <rect class="cell-v" x="0" y="66" width="58" height="58"/><rect class="cell-v" x="66" y="66" width="58" height="58"/><rect class="cell-v" x="132" y="66" width="58" height="58"/>
    <text class="txt small" x="68" y="154">V</text>
  </g>
  <line class="arrow" x1="438" y1="292" x2="512" y2="292"/>
  <text class="txt note muted" x="392" y="320">2 x 2 Y block</text>
  <text class="txt note muted" x="476" y="344">shares chroma</text>
</svg>
