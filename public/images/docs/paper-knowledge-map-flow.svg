<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">论文筛选与主题归类流程</title><desc id="desc">28 个批次经时间筛选得到 314 篇唯一论文，其中 278 篇归入 26 个独立知识点，36 篇保留在范围外清单。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#356b8c"/></marker><style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#173042}.head{font-size:29px;font-weight:700}.sub{font-size:18px;fill:#536779}.label{font-size:21px;font-weight:700}.small{font-size:17px}.box{fill:#f5fafc;stroke:#6d9db7;stroke-width:2}.em{fill:#e3f1f7;stroke:#2f7294;stroke-width:2.5}.green{fill:#eef7ed;stroke:#6d9d72;stroke-width:2}.amber{fill:#fff6e4;stroke:#c79a4b;stroke-width:2}.line{stroke:#356b8c;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1200" height="480" rx="24" fill="#fffdf8"/><text x="60" y="62" class="head">最近一月论文：从原始记录到知识点文档</text><text x="60" y="96" class="sub">按 published 时间筛选，不按爬取批次或中文总结数量推断发表日期</text><rect x="60" y="160" width="230" height="150" rx="18" class="box"/><text x="175" y="217" class="label" text-anchor="middle">28 个日期批次</text><text x="175" y="254" class="small" text-anchor="middle">spiders 原始 JSON</text><rect x="360" y="160" width="230" height="150" rx="18" class="em"/><text x="475" y="217" class="label" text-anchor="middle">314 篇唯一论文</text><text x="475" y="254" class="small" text-anchor="middle">2026-08-27—09-27</text><rect x="660" y="135" width="230" height="150" rx="18" class="green"/><text x="775" y="192" class="label" text-anchor="middle">278 篇站内相关</text><text x="775" y="229" class="small" text-anchor="middle">归入 26 个知识点</text><rect x="660" y="320" width="230" height="115" rx="18" class="amber"/><text x="775" y="370" class="label" text-anchor="middle">36 篇范围外</text><text x="775" y="402" class="small" text-anchor="middle">保留可复核清单</text><rect x="965" y="135" width="185" height="150" rx="18" class="em"/><text x="1057" y="192" class="label" text-anchor="middle">独立主题页</text><text x="1057" y="229" class="small" text-anchor="middle">来源可追溯</text><path d="M290 235h70M590 235h70M890 210h75" class="line"/><path d="M590 235h34v142h36" class="line"/></svg>