<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">从 VRS 原始记录到具身智能 episode 的数据契约</title>
  <desc id="desc">图示将 VRS 的相机、IMU 和标定数据解码并按时间和坐标系对齐，再导出版本化 episode、质量标记和训练视图的过程。</desc>
  <defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.raw{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.process{fill:#ecfdf5;stroke:#059669;stroke-width:2}.out{fill:#fef3c7;stroke:#d97706;stroke-width:2}.risk{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.title{font:700 30px Arial,"Noto Sans SC",sans-serif;fill:#0f172a}.h{font:700 21px Arial,"Noto Sans SC",sans-serif;fill:#0f172a}.t{font:17px Arial,"Noto Sans SC",sans-serif;fill:#334155}.s{font:15px Arial,"Noto Sans SC",sans-serif;fill:#475569}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="620"/><text class="title" x="60" y="60">VRS 不是训练样本：需要显式的数据契约把原始记录变成 episode</text>
  <rect class="raw" x="60" y="125" width="230" height="250" rx="8"/><text class="h" x="128" y="170">VRS 原始记录</text><text class="t" x="91" y="215">stream id 与传感器配置</text><text class="t" x="91" y="252">图像、IMU、音频记录</text><text class="t" x="91" y="289">设备标定与时间戳</text><text class="s" x="91" y="338">保持不可变，可回溯</text>
  <rect class="process" x="380" y="125" width="230" height="250" rx="8"/><text class="h" x="434" y="170">标准化处理</text><text class="t" x="411" y="215">选择主时间轴</text><text class="t" x="411" y="252">采样、解码与单位转换</text><text class="t" x="411" y="289">坐标系与外参变换</text><text class="s" x="411" y="338">输出转换日志与版本</text>
  <rect class="out" x="700" y="125" width="230" height="250" rx="8"/><text class="h" x="768" y="170">Episode 契约</text><text class="t" x="731" y="215">观测、状态与动作索引</text><text class="t" x="731" y="252">calibration_version</text><text class="t" x="731" y="289">frame/timestamp 映射</text><text class="s" x="731" y="338">quality_flags 与溯源路径</text>
  <rect class="box" x="1010" y="125" width="130" height="250" rx="8"/><text class="h" x="1030" y="170">训练与评估</text><text class="t" x="1033" y="220">窗口采样</text><text class="t" x="1033" y="260">数据集划分</text><text class="t" x="1033" y="300">失败分析</text>
  <path class="arrow" d="M290 250 L376 250 M610 250 L696 250 M930 250 L1006 250"/>
  <rect class="risk" x="60" y="455" width="1080" height="95" rx="8"/><text class="h" x="96" y="492">必须保留的可验证关系</text><text class="t" x="96" y="525">源 VRS 校验和与工具版本  |  stream 与传感器语义  |  timestamp 映射与容差  |  坐标系和标定版本  |  缺帧、重采样、轨迹失败标记</text>
</svg>
