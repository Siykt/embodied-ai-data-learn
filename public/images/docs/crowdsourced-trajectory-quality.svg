<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">众包轨迹质量筛选关系</title>
  <desc id="desc">众包轨迹先经过身份和任务版本检查，再进行时间同步、物理回放和质量评分，按拒绝原因分流到训练、评估或返工队列。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356ae6"/></marker>
    <style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#172033}.h{font-size:22px;font-weight:700}.s{font-size:16px}.b{fill:#f7f9fc;stroke:#aebbd2;stroke-width:3}.a{fill:#eaf1ff;stroke:#356ae6;stroke-width:3}.q{fill:#fff7e6;stroke:#d28b24;stroke-width:3}.r{fill:#fff0f0;stroke:#c75c5c;stroke-width:3}.g{fill:#edf8f2;stroke:#3b9b68;stroke-width:3}</style>
  </defs>
  <rect width="1280" height="500" fill="#fff"/>
  <text x="640" y="48" text-anchor="middle" class="h">众包轨迹质量筛选</text>
  <rect x="35" y="120" width="190" height="180" rx="16" class="b"/><text x="130" y="168" text-anchor="middle" class="h">身份 / 版本</text><text x="130" y="207" text-anchor="middle" class="s">operator_id 化名</text><text x="130" y="238" text-anchor="middle" class="s">task_version</text><text x="130" y="269" text-anchor="middle" class="s">schema / 会话</text>
  <rect x="270" y="120" width="190" height="180" rx="16" class="a"/><text x="365" y="168" text-anchor="middle" class="h">时间同步</text><text x="365" y="207" text-anchor="middle" class="s">设备 / 仿真时钟</text><text x="365" y="238" text-anchor="middle" class="s">输入到执行延迟</text><text x="365" y="269" text-anchor="middle" class="s">缺口 / 重连</text>
  <rect x="505" y="120" width="190" height="180" rx="16" class="g"/><text x="600" y="168" text-anchor="middle" class="h">物理回放</text><text x="600" y="207" text-anchor="middle" class="s">动作可执行性</text><text x="600" y="238" text-anchor="middle" class="s">碰撞 / 关节限制</text><text x="600" y="269" text-anchor="middle" class="s">结果可重建</text>
  <rect x="740" y="120" width="190" height="180" rx="16" class="q"/><text x="835" y="168" text-anchor="middle" class="h">质量评分</text><text x="835" y="207" text-anchor="middle" class="s">完整度 / 对齐</text><text x="835" y="238" text-anchor="middle" class="s">任务成功与否</text><text x="835" y="269" text-anchor="middle" class="s">人工复核</text>
  <rect x="975" y="85" width="245" height="95" rx="16" class="g"/><text x="1097" y="125" text-anchor="middle" class="h">可训练数据集</text><text x="1097" y="153" text-anchor="middle" class="s">通过准入 + 可追溯</text>
  <rect x="975" y="205" width="245" height="95" rx="16" class="b"/><text x="1097" y="245" text-anchor="middle" class="h">评估 / 失败集</text><text x="1097" y="273" text-anchor="middle" class="s">完整但不适合训练</text>
  <rect x="975" y="325" width="245" height="95" rx="16" class="r"/><text x="1097" y="365" text-anchor="middle" class="h">拒绝 / 返工</text><text x="1097" y="393" text-anchor="middle" class="s">隐私、身份、缺口等原因</text>
  <path d="M225 210H260M460 210H495M695 210H730M930 160H965M930 230H965M930 270C950 320 950 355 965 370" stroke="#356ae6" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <text x="640" y="465" text-anchor="middle" class="s">拒绝原因、评分、原始文件与处理运行共同构成数据血缘</text>
</svg>
