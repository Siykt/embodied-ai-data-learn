<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc"><title id="title">实时执行：预测时间线不等于执行时间线</title><desc id="desc">三条并行时间线显示带时间戳历史输入、异步新块计算、旧块已提交前缀和新块待执行后缀，必须记录边界修正和实际生效时刻。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:650}.b{font-size:20px}.s{font-size:18px;fill:#475569}.white{font-size:20px;fill:white}</style><rect width="1120" height="690" rx="24" fill="#f8fafc"/><text x="40" y="56" class="t">实时执行：预测时间线不等于执行时间线</text><text x="40" y="94" class="s">动作年龄从观测开始计时；推理期间，旧动作仍可能继续执行。</text><text x="40" y="195" class="h">观测</text><line x1="150" y1="190" x2="1060" y2="190" stroke="#94a3b8" stroke-width="2"/><text x="40" y="315" class="h">推理</text><line x1="150" y1="310" x2="1060" y2="310" stroke="#94a3b8" stroke-width="2"/><text x="40" y="435" class="h">执行</text><line x1="150" y1="430" x2="1060" y2="430" stroke="#94a3b8" stroke-width="2"/><rect x="170" y="135" width="240" height="92" rx="18" fill="#dbeafe" stroke="#cbd5e1"/><text x="192" y="175" class="h">历史窗口</text><text x="192" y="214" class="b">帧时间 + 缺帧</text><rect x="460" y="255" width="330" height="92" rx="18" fill="#ede9fe" stroke="#cbd5e1"/><text x="482" y="295" class="h">生成新动作块</text><text x="482" y="334" class="b">积分步数 + 推理设备</text><rect x="170" y="375" width="400" height="92" rx="18" fill="#cffafe" stroke="#cbd5e1"/><text x="192" y="415" class="h">旧块：已提交前缀</text><text x="192" y="454" class="b">按实际生效时间重建</text><rect x="720" y="375" width="340" height="92" rx="18" fill="#dcfce7" stroke="#cbd5e1"/><text x="742" y="415" class="h">新块：待执行后缀</text><text x="742" y="454" class="b">边界修正 + 取消原因</text><path d="M415 185 L450 285" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M795 295 L850 365" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M575 420 L710 420" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="590" y="395" class="s">交接边界</text><path d="M190 490 L1020 490" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><text x="190" y="516" class="s">时间推进：观测 → 排队 → 生成 → 提交 → 真正生效</text><rect x="40" y="550" width="1040" height="100" rx="18" fill="#ffedd5" stroke="#cbd5e1"/><text x="62" y="590" class="h">同一次执行同时验收</text><text x="62" y="629" class="b">历史秒数、控制周期、积分预算、动作年龄、边界误差与任务结果。</text></svg>