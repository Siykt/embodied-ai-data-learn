<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
 <title id="title">相机内参的标注与数据血缘</title><desc id="desc">原始帧和对应内参一起经过图像处理，再支撑二维标注、三维派生数据、训练样本和质量分桶。</desc>
 <style>.bg{fill:#f8fafc}.raw{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.proc{fill:#e0f2fe;stroke:#0891b2;stroke-width:2}.data{fill:#ecfccb;stroke:#65a30d;stroke-width:2}.out{fill:#fef3c7;stroke:#d97706;stroke-width:2}.h{font:700 25px system-ui,sans-serif;fill:#0f172a}.t{font:700 18px system-ui,sans-serif;fill:#1e293b}.s{font:500 15px system-ui,sans-serif;fill:#334155}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
 <rect class="bg" width="1200" height="510"/><text class="h" x="50" y="55">内参版本贯穿标注、派生数据、训练和评估</text>
 <rect class="raw" x="55" y="145" width="210" height="130" rx="12"/><text class="t" x="104" y="186">原始图像帧</text><text class="s" x="83" y="222">frame_id · timestamp</text><text class="s" x="83" y="248">camera_id</text>
 <rect class="raw" x="55" y="325" width="210" height="110" rx="12"/><text class="t" x="95" y="365">内参记录</text><text class="s" x="83" y="400">model · K · distortion</text>
 <rect class="proc" x="350" y="145" width="220" height="130" rx="12"/><text class="t" x="388" y="186">图像处理</text><text class="s" x="378" y="222">裁剪 / 缩放 / 去畸变</text><text class="s" x="378" y="248">更新 image_state</text>
 <rect class="data" x="655" y="105" width="210" height="125" rx="12"/><text class="t" x="704" y="146">二维标注</text><text class="s" x="681" y="182">框、关键点、掩码</text><text class="s" x="681" y="208">绑定标定版本</text>
 <rect class="data" x="655" y="290" width="210" height="125" rx="12"/><text class="t" x="694" y="331">三维派生</text><text class="s" x="681" y="367">射线、点云、位姿</text><text class="s" x="681" y="393">关联外参与时间</text>
 <rect class="out" x="950" y="190" width="200" height="135" rx="12"/><text class="t" x="994" y="231">数据集使用</text><text class="s" x="976" y="267">训练分片</text><text class="s" x="976" y="293">质量分桶评估</text>
 <line class="arrow" x1="265" y1="210" x2="350" y2="210"/><line class="arrow" x1="265" y1="380" x2="350" y2="245"/><line class="arrow" x1="570" y1="195" x2="655" y2="168"/><line class="arrow" x1="570" y1="245" x2="655" y2="350"/><line class="arrow" x1="865" y1="168" x2="950" y2="240"/><line class="arrow" x1="865" y1="352" x2="950" y2="282"/>
 <text class="s" x="54" y="478">任一内参或处理规则被修正时，可依据版本关系定位需要重算的标签、三维数据和训练样本。</text>
</svg>
