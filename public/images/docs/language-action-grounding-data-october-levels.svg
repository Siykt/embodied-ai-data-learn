<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">语言动作对齐：阶段语义连接物理目标</title><desc id="desc">左侧为任务到阶段再到原子动作的层级，右侧连接对象目标、预期后果与真实后态，底部区分改写等价与约束改变。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:650}.b{font-size:20px}.s{font-size:18px;fill:#475569}.white{font-size:20px;fill:white}</style><rect width="1120" height="680" rx="24" fill="#f8fafc"/><text x="40" y="56" class="t">语言动作对齐：阶段语义连接物理目标</text><rect x="40" y="125" width="460" height="105" rx="18" fill="#dbeafe" stroke="#cbd5e1"/><text x="62" y="165" class="h">组合任务</text><text x="62" y="204" class="b">父任务 ID + 全程目标</text><rect x="40" y="265" width="460" height="105" rx="18" fill="#cffafe" stroke="#cbd5e1"/><text x="62" y="305" class="h">阶段指令</text><text x="62" y="344" class="b">有效时间区间 + 被指对象</text><rect x="40" y="405" width="460" height="105" rx="18" fill="#ede9fe" stroke="#cbd5e1"/><text x="62" y="445" class="h">原子动作词</text><text x="62" y="484" class="b">动作窗口 + 视觉 / 触觉后果</text><path d="M270 235 L270 255" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M270 375 L270 395" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="620" y="150" width="460" height="140" rx="18" fill="#ffedd5" stroke="#cbd5e1"/><text x="642" y="190" class="h">可验证目标</text><text x="642" y="229" class="b">对象 ID、目标关系、编辑区域</text><text x="642" y="261" class="b">推理说明与预期效果分别保存</text><rect x="620" y="350" width="460" height="140" rx="18" fill="#dcfce7" stroke="#cbd5e1"/><text x="642" y="390" class="h">实际后态</text><text x="642" y="429" class="b">执行帧、接触、任务结果</text><text x="642" y="461" class="b">预期正确与执行成功分开判断</text><path d="M505 315 L610 220" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M505 455 L610 420" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M850 295 L850 340" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="40" y="545" width="1040" height="100" rx="18" fill="#ffedd5" stroke="#cbd5e1"/><text x="62" y="585" class="h">指令对照的前提</text><text x="62" y="624" class="b">同义改写保持任务与初始状态；动作约束改变应标注为不同目标。</text></svg>