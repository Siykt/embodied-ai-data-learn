<title id="title">从总体成功率走向证据与覆盖审计</title>
<desc id="desc">评估对象：计划 / 视频 / 真实执行、任务版本与阶段验证器、源任务到目标任务的边界；证据等级：引擎记录与传感器事实、视觉估计与自动裁判、离线回报只是估计；覆盖与分母：总执行 N / 真失败 F、误接受 M：M/N 与 M/F、预算、切片、未观测阶段</desc>
