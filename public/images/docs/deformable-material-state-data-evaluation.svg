<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc"><title id="title">可变形物体与材质状态数据：评估</title><desc id="desc">可变形数据按形状重建、状态预测及真实操作迁移评估</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8766a8" stroke-width="1.6"/></marker></defs>
<rect width="1000" height="280" rx="20" fill="#f3f8fc"/>
<text x="32" y="42" font-size="22" font-weight="700" fill="#17324d">可变形物体与材质状态数据</text>
<text x="32" y="67" font-size="14" fill="#466178">分层检验，避免单一总分遮蔽失败模式</text>
<rect x="42" y="93" width="280" height="105" rx="16" fill="#fff" stroke="#8766a8" stroke-width="2"/><text x="182.0" y="131" text-anchor="middle" font-size="19" font-weight="700" fill="#17324d">重建</text><text x="182.0" y="162" text-anchor="middle" font-size="13" fill="#466178">遮挡下完整形状</text><rect x="362" y="93" width="280" height="105" rx="16" fill="#fff" stroke="#8766a8" stroke-width="2"/><text x="502.0" y="131" text-anchor="middle" font-size="19" font-weight="700" fill="#17324d">预测</text><text x="502.0" y="162" text-anchor="middle" font-size="13" fill="#466178">不同材料的演化</text><rect x="682" y="93" width="280" height="105" rx="16" fill="#fff" stroke="#8766a8" stroke-width="2"/><text x="822.0" y="131" text-anchor="middle" font-size="19" font-weight="700" fill="#17324d">操作</text><text x="822.0" y="162" text-anchor="middle" font-size="13" fill="#466178">折叠塑形与迁移</text><path d="M 42 225 H 958" stroke="#8766a8" stroke-width="3"/><text x="500" y="251" text-anchor="middle" font-size="14" fill="#466178">逐场景、物体、机器人、时间段分层报告；保留失败样本</text>
