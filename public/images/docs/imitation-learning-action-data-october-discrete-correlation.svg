<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">动作量化和动作相关性分别验收</title>
<desc id="desc">连续动作块分箱后保留量化规则；解码误差与跨时间和维度的组合错误不同，最终需在固定控制频率下闭环验证。</desc>
