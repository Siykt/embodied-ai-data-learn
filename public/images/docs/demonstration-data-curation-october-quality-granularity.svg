<circle cx="63" cy="252" r="4" fill="#0f766e"/>
<text x="78" y="258" font-size="18" fill="#1e293b">对象 / 接触状态</text>
<circle cx="63" cy="295" r="4" fill="#0f766e"/>
<text x="78" y="301" font-size="18" fill="#1e293b">人类干预时间与来源</text>
<circle cx="63" cy="338" r="4" fill="#0f766e"/>
<text x="78" y="344" font-size="18" fill="#1e293b">成功条件 / 回放记录</text>
<circle cx="63" cy="381" r="4" fill="#0f766e"/>
<text x="78" y="387" font-size="18" fill="#1e293b">原始 episode 不改写</text>
<rect x="430" y="115" width="340" height="326" rx="14" fill="white" stroke="#cbd5e1"/>
<rect x="430" y="115" width="340" height="61" rx="14" fill="#1d4ed8"/>
<text x="450" y="154" font-size="23" font-weight="650" fill="white">质量条件路径</text>
<text x="450" y="211" font-size="19" font-weight="600" fill="#1d4ed8">定义与粒度分开</text>
<circle cx="453" cy="252" r="4" fill="#1d4ed8"/>
<text x="468" y="258" font-size="18" fill="#1e293b">评分规则版本</text>
<circle cx="453" cy="295" r="4" fill="#1d4ed8"/>
<text x="468" y="301" font-size="18" fill="#1e293b">episode 或动作块</text>
<circle cx="453" cy="338" r="4" fill="#1d4ed8"/>
<text x="468" y="344" font-size="18" fill="#1e293b">过滤 / 加权 / 条件</text>
<circle cx="453" cy="381" r="4" fill="#1d4ed8"/>
<text x="468" y="387" font-size="18" fill="#1e293b">微调与推理标签设置</text>
<rect x="820" y="115" width="340" height="326" rx="14" fill="white" stroke="#cbd5e1"/>
<rect x="820" y="115" width="340" height="61" rx="14" fill="#7e22ce"/>
<text x="840" y="154" font-size="23" font-weight="650" fill="white">可达图路径</text>
<text x="840" y="211" font-size="19" font-weight="600" fill="#7e22ce">按任务推进重加权</text>
<circle cx="843" cy="252" r="4" fill="#7e22ce"/>
<text x="858" y="258" font-size="18" fill="#1e293b">状态连接规则</text>
<circle cx="843" cy="295" r="4" fill="#7e22ce"/>
<text x="858" y="301" font-size="18" fill="#1e293b">距成功的剩余步数</text>
<circle cx="843" cy="338" r="4" fill="#7e22ce"/>
<text x="858" y="344" font-size="18" fill="#1e293b">动作前后距离变化</text>
<circle cx="843" cy="381" r="4" fill="#7e22ce"/>
<text x="858" y="387" font-size="18" fill="#1e293b">新 rollout → 图新版本</text>
