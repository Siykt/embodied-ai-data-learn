<text x="61" y="503" font-size="20" font-weight="600" fill="#0f172a">成功轨迹可含退步；失败轨迹可含可利用的恢复动作</text>
<text x="61" y="535" font-size="18" fill="#334155">控制比较：相同原始数据、训练预算与留出任务；抽查图中的跨轨迹连接</text>
