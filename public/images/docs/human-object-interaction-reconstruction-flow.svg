<text x="487" y="252" text-anchor="start" fill="#213548" font-size="23" font-weight="700" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif">尺度与姿态</text>
<text x="487" y="289" text-anchor="start" fill="#526b7f" font-size="17" font-weight="400" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif">世界系 4D 轨迹</text>
