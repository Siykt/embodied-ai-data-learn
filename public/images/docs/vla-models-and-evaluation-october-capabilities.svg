<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc"><title id="title">系统评测：五类能力分别留证据</title><desc id="desc">PAPAV五类能力为感知、预判后果、规划、行动和验证；每类独立保存标签及来源，并控制工具接口、推理预算和环境版本。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:650}.b{font-size:20px}.s{font-size:18px;fill:#475569}.white{font-size:20px;fill:white}</style><rect width="1120" height="690" rx="24" fill="#f8fafc"/><text x="40" y="56" class="t">系统评测：五类能力分别留证据</text><text x="40" y="94" class="s">固定模型、执行组织层、工具接口和环境版本，再比较能力。</text><rect x="40" y="125" width="1040" height="62" rx="12" fill="#dbeafe"/><text x="65" y="164" class="h">1  感知</text><text x="300" y="164" class="b">当前状态与对象证据</text><text x="790" y="164" class="s">独立标签 + 来源证据</text><rect x="40" y="201" width="1040" height="62" rx="12" fill="#cffafe"/><text x="65" y="240" class="h">2  预判后果</text><text x="300" y="240" class="b">候选动作与预期后态</text><text x="790" y="240" class="s">独立标签 + 来源证据</text><rect x="40" y="277" width="1040" height="62" rx="12" fill="#ede9fe"/><text x="65" y="316" class="h">3  规划</text><text x="300" y="316" class="b">目标、约束与可行路线</text><text x="790" y="316" class="s">独立标签 + 来源证据</text><rect x="40" y="353" width="1040" height="62" rx="12" fill="#dcfce7"/><text x="65" y="392" class="h">4  行动</text><text x="300" y="392" class="b">工具参数与实际运动</text><text x="790" y="392" class="s">独立标签 + 来源证据</text><rect x="40" y="429" width="1040" height="62" rx="12" fill="#ffedd5"/><text x="65" y="468" class="h">5  验证</text><text x="300" y="468" class="b">完成证据与判定错误</text><text x="790" y="468" class="s">独立标签 + 来源证据</text><rect x="40" y="550" width="1040" height="100" rx="18" fill="#ffedd5" stroke="#cbd5e1"/><text x="62" y="590" class="h">结果与预算同时保存</text><text x="62" y="629" class="b">任务分项结果、工具调用、推理预算与重试次数；仿真接口成绩不替代实机验证。</text></svg>