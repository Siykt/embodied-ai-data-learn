<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 553" role="img" aria-labelledby="title desc"><title id="title">用糕点装盒理解两个项目的分工</title><desc id="desc">DiagGen准备虚拟物体资产，SoftVTBench组织操作练习、记录和评价。此图是职责类比。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#377d75"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif"><rect width="720" height="553" rx="22" fill="#fcfcf8"/><text x="32" y="49" font-size="28" font-weight="700" fill="#254044">糕点装盒：准备物体，再组织练习</text><rect x="28" y="85" width="664" height="183" rx="16" fill="#edf6f4" stroke="#b6d5ce" stroke-width="2"/><text x="50" y="126" font-size="27" font-weight="700" fill="#254044">准备练习材料 → DiagGen</text><text x="50" y="171" font-size="23" font-weight="400" fill="#254044">一张图片 → 形状、材料假设和诊断记录</text><text x="50" y="209" font-size="23" font-weight="400" fill="#254044">先检查：软硬部件及连接是否合理？</text><text x="50" y="243" font-size="21" font-weight="400" fill="#254044">交付：可用于后续仿真的物体资产</text><rect x="28" y="295" width="664" height="183" rx="16" fill="#edf3fa" stroke="#b9cce1" stroke-width="2"/><text x="50" y="336" font-size="27" font-weight="700" fill="#254044">练习与验收 → SoftVTBench</text><text x="50" y="381" font-size="23" font-weight="400" fill="#254044">机器人抓取 → 画面、触觉、动作和结果</text><text x="50" y="419" font-size="23" font-weight="400" fill="#254044">分别检查：放到目标了吗？形变合格吗？</text><text x="50" y="453" font-size="21" font-weight="400" fill="#254044">交付：操作记录、训练与评测流程</text><text x="32" y="523" font-size="22" font-weight="400" fill="#254044">两项目分工互补；连接它们还需要资产适配。</text></g></svg>