<text x="858" y="387" font-size="18" fill="#1e293b">实机：单支撑站立</text>
<rect x="40" y="468" width="1120" height="89" rx="12" fill="#e2e8f0"/>
<text x="61" y="503" font-size="20" font-weight="600" fill="#0f172a">状态完整性：同样的关节角，不保证柔性腿形状和足端位置相同</text>
<text x="61" y="535" font-size="18" fill="#334155">覆盖检查：站立平衡数据不能代替支撑切换、动态冲击与实机行走</text>
</g></svg>
