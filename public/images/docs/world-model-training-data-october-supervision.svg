<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">世界模型：监督来源与三层验证</title><desc id="desc">三列分别显示样本来源和可见条件、物理与动作条件、状态预测控制三层验证；底部强调适配片段与正式评测隔离。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:650}.b{font-size:20px}.s{font-size:18px;fill:#475569}.white{font-size:20px;fill:white}</style><rect width="1120" height="660" rx="24" fill="#f8fafc"/><text x="40" y="56" class="t">世界模型：监督来源与三层验证</text><text x="40" y="94" class="s">每个派生窗口都应回答：依据什么、预测什么、如何证明有用？</text><rect x="40" y="130" width="320" height="340" rx="18" fill="#dbeafe" stroke="#cbd5e1"/><text x="62" y="170" class="h">1  来源与可见条件</text><text x="62" y="209" class="b">人类 / 机器人 / 生成</text><text x="62" y="241" class="b">当前观测与历史窗口</text><text x="62" y="273" class="b">可见模态 / 目标模态</text><text x="62" y="305" class="b">原始动作接口与单位</text><text x="62" y="337" class="b">条件掩码与标注版本</text><rect x="400" y="130" width="320" height="340" rx="18" fill="#ede9fe" stroke="#cbd5e1"/><text x="422" y="170" class="h">2  动作与物理条件</text><text x="422" y="209" class="b">相机变化 ≠ 物体作用</text><text x="422" y="241" class="b">同起点、不同动作</text><text x="422" y="273" class="b">同物理配置的探索片段</text><text x="422" y="305" class="b">真实后态 / 生成后态</text><text x="422" y="337" class="b">空间、时间压缩配置</text><rect x="760" y="130" width="320" height="340" rx="18" fill="#dcfce7" stroke="#cbd5e1"/><text x="782" y="170" class="h">3  分层质量验证</text><text x="782" y="209" class="b">状态：物理量可恢复</text><text x="782" y="241" class="b">预测：接触与运动一致</text><text x="782" y="273" class="b">控制：闭环任务结果</text><text x="782" y="305" class="b">干扰对照与组合留出</text><text x="782" y="337" class="b">设备时延与动作年龄</text><path d="M364 300 L390 300" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M724 300 L750 300" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="40" y="520" width="1040" height="100" rx="18" fill="#ffedd5" stroke="#cbd5e1"/><text x="62" y="560" class="h">共同约束</text><text x="62" y="599" class="b">保留来源血缘；适配片段与正式评测隔离；视觉质量不能替代动作后果。</text></svg>