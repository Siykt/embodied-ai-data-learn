<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc"><title id="title">世界模型训练数据与物理表征：评估</title><desc id="desc">世界模型按预测一致性、物理可辨性及下游决策可用性分层评估</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#126f86" stroke-width="1.6"/></marker></defs>
<rect width="1000" height="280" rx="20" fill="#f3f8fc"/>
<text x="32" y="42" font-size="22" font-weight="700" fill="#17324d">世界模型训练数据与物理表征</text>
<text x="32" y="67" font-size="14" fill="#466178">分层检验，避免单一总分遮蔽失败模式</text>
<rect x="42" y="93" width="280" height="105" rx="16" fill="#fff" stroke="#126f86" stroke-width="2"/><text x="182.0" y="131" text-anchor="middle" font-size="19" font-weight="700" fill="#17324d">预测一致性</text><text x="182.0" y="162" text-anchor="middle" font-size="13" fill="#466178">跨视角与时间</text><rect x="362" y="93" width="280" height="105" rx="16" fill="#fff" stroke="#126f86" stroke-width="2"/><text x="502.0" y="131" text-anchor="middle" font-size="19" font-weight="700" fill="#17324d">物理可辨性</text><text x="502.0" y="162" text-anchor="middle" font-size="13" fill="#466178">质量·摩擦·运动</text><rect x="682" y="93" width="280" height="105" rx="16" fill="#fff" stroke="#126f86" stroke-width="2"/><text x="822.0" y="131" text-anchor="middle" font-size="19" font-weight="700" fill="#17324d">下游可用性</text><text x="822.0" y="162" text-anchor="middle" font-size="13" fill="#466178">候选动作选择</text><path d="M 42 225 H 958" stroke="#126f86" stroke-width="3"/><text x="500" y="251" text-anchor="middle" font-size="14" fill="#466178">逐场景、物体、机器人、时间段分层报告；保留失败样本</text>
