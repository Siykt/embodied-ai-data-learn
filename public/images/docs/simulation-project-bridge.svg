<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 810" role="img" aria-labelledby="title desc"><title id="title">两个项目的潜在数据衔接路线</title><desc id="desc">生成和Genesis诊断后仍需跨引擎转换校准，才能进入Isaac任务和SoftVTBench操作记录及评价。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#377d75"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif"><rect width="720" height="810" rx="22" fill="#fcfcf8"/><text x="32" y="49" font-size="28" font-weight="700" fill="#254044">从一张图片，到一次可评价的操作</text><rect x="28" y="88" width="664" height="130" rx="16" fill="#edf6f4" stroke="#b6d5ce" stroke-width="2"/><text x="50" y="127" font-size="26" font-weight="700" fill="#254044">DiagGen：生成物体</text><text x="50" y="170" font-size="23" font-weight="400" fill="#254044">图片 → 部件与形状 → 材料与体积网格</text><text x="50" y="202" font-size="21" font-weight="400" fill="#254044">尺寸和材料是待验证的假设</text><path d="M360 222 V247" fill="none" stroke="#377d75" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="260" width="664" height="130" rx="16" fill="#edf6f4" stroke="#b6d5ce" stroke-width="2"/><text x="50" y="299" font-size="26" font-weight="700" fill="#254044">Genesis：诊断并提供返工依据</text><text x="50" y="342" font-size="23" font-weight="400" fill="#254044">施加载荷，观察连接、形变与恢复</text><text x="50" y="374" font-size="21" font-weight="400" fill="#254044">需要修正时，返回对应的生成阶段</text><path d="M360 394 V419" fill="none" stroke="#377d75" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="432" width="664" height="130" rx="16" fill="#fff3e5" stroke="#b48a55" stroke-width="2" stroke-dasharray="8 6"/><text x="50" y="471" font-size="26" font-weight="700" fill="#254044">尚需开发：跨引擎适配与校准</text><text x="50" y="514" font-size="23" font-weight="400" fill="#254044">转换资产，核对尺寸、材料和任务</text><text x="50" y="546" font-size="21" font-weight="400" fill="#254044">为新物体重新确定形变阈值</text><path d="M360 566 V591" fill="none" stroke="#377d75" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="604" width="664" height="130" rx="16" fill="#edf3fa" stroke="#b9cce1" stroke-width="2"/><text x="50" y="643" font-size="26" font-weight="700" fill="#254044">SoftVTBench：操作、记录与评分</text><text x="50" y="686" font-size="23" font-weight="400" fill="#254044">Isaac 场景 → 视觉触觉轨迹 → 训练与测试</text><text x="50" y="718" font-size="21" font-weight="400" fill="#254044">保留资产、数据与评分规则的版本</text><text x="32" y="779" font-size="22" font-weight="400" fill="#254044">这是潜在衔接路线，尚未在本机完成集成。</text></g></svg>