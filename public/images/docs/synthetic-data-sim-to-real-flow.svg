<text x="700" y="252" text-anchor="start" fill="#213548" font-size="23" font-weight="700" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif">数据准入</text>
<text x="700" y="289" text-anchor="start" fill="#526b7f" font-size="17" font-weight="400" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif">质量与血缘</text>
