<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">从驾校练习理解机器人仿真</title><desc id="desc">四组对应关系：场地与模型、车辆反应与物理计算、教练与规则、记录与数据。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#377d75"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif"><rect width="720" height="650" rx="22" fill="#fcfcf8"/><text x="32" y="49" font-size="29" font-weight="700" fill="#254044">从学车经验理解机器人仿真</text><text x="32" y="84" font-size="22" font-weight="400" fill="#254044">把熟悉的分工，对应到虚拟练习场</text><rect x="28" y="110" width="664" height="101" rx="16" fill="#edf6f4" stroke="#b6d5ce" stroke-width="2"/><text x="46" y="143" font-size="23" font-weight="600" fill="#254044">道路与车辆</text><text x="348" y="143" font-size="23" font-weight="600" fill="#254044">→ 场景与机器人</text><text x="46" y="185" font-size="22" font-weight="400" fill="#254044">确定在哪练、用什么练</text><rect x="28" y="227" width="664" height="101" rx="16" fill="#edf6f4" stroke="#b6d5ce" stroke-width="2"/><text x="46" y="260" font-size="23" font-weight="600" fill="#254044">转向与刹车后的反应</text><text x="348" y="260" font-size="23" font-weight="600" fill="#254044">→ 物理计算</text><text x="46" y="302" font-size="22" font-weight="400" fill="#254044">计算动作之后会发生什么</text><rect x="28" y="344" width="664" height="101" rx="16" fill="#edf6f4" stroke="#b6d5ce" stroke-width="2"/><text x="46" y="377" font-size="23" font-weight="600" fill="#254044">教练规定练习要求</text><text x="348" y="377" font-size="23" font-weight="600" fill="#254044">→ 任务规则</text><text x="46" y="419" font-size="22" font-weight="400" fill="#254044">明确起点、成功与结束条件</text><rect x="28" y="461" width="664" height="101" rx="16" fill="#edf6f4" stroke="#b6d5ce" stroke-width="2"/><text x="46" y="494" font-size="23" font-weight="600" fill="#254044">行车记录与复盘</text><text x="348" y="494" font-size="23" font-weight="600" fill="#254044">→ 轨迹与评价</text><text x="46" y="536" font-size="22" font-weight="400" fill="#254044">保存画面、动作、时间和结果</text><text x="32" y="620" font-size="22" font-weight="500" fill="#254044">类比边界：模拟结果仍需真实设备验证。</text></g></svg>