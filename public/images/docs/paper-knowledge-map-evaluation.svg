<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">论文主题覆盖数量</title><desc id="desc">两个纵列展示 26 个知识点主题的论文数量，并注明另有 36 篇范围外论文。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#356b8c"/></marker><style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#173042}.head{font-size:29px;font-weight:700}.sub{font-size:18px;fill:#536779}.label{font-size:21px;font-weight:700}.small{font-size:17px}.box{fill:#f5fafc;stroke:#6d9db7;stroke-width:2}.em{fill:#e3f1f7;stroke:#2f7294;stroke-width:2.5}.green{fill:#eef7ed;stroke:#6d9d72;stroke-width:2}.amber{fill:#fff6e4;stroke:#c79a4b;stroke-width:2}.line{stroke:#356b8c;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1200" height="820" rx="24" fill="#fffdf8"/><text x="48" y="54" class="head">26 个主题的论文数量</text><text x="48" y="84" class="sub">按唯一主主题计数，覆盖 278 篇；条形长度不代表质量或重要性</text><text x="50" y="142" class="small">示教与遥操作</text><rect x="268" y="126" width="110" height="22" rx="5" fill="#6d9db7"/><text x="500" y="143" class="small">11</text><text x="50" y="190" class="small">人体与人-物重建</text><rect x="268" y="174" width="60" height="22" rx="5" fill="#6d9db7"/><text x="500" y="191" class="small">6</text><text x="50" y="238" class="small">仿真与真实迁移</text><rect x="268" y="222" width="100" height="22" rx="5" fill="#6d9db7"/><text x="500" y="239" class="small">10</text><text x="50" y="286" class="small">传感器时空对齐</text><rect x="268" y="270" width="40" height="22" rx="5" fill="#6d9db7"/><text x="500" y="287" class="small">4</text><text x="50" y="334" class="small">三维空间表征</text><rect x="268" y="318" width="110" height="22" rx="5" fill="#6d9db7"/><text x="500" y="335" class="small">11</text><text x="50" y="382" class="small">主动感知</text><rect x="268" y="366" width="50" height="22" rx="5" fill="#6d9db7"/><text x="500" y="383" class="small">5</text><text x="50" y="430"