<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">技能数据：程序、接口与物理响应</title><desc id="desc">技能程序映射到观测动作片段，接口核验参数和前置条件，响应检验控制器与实际后态，再评价跨技能组合。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:650}.b{font-size:20px}.s{font-size:18px;fill:#475569}.white{font-size:20px;fill:white}</style><rect width="1120" height="660" rx="24" fill="#f8fafc"/><text x="40" y="56" class="t">技能数据：程序、接口与物理响应</text><text x="40" y="94" class="s">名称相同的技能，只有输入条件与完成标准一致时才适合复用。</text><rect x="40" y="135" width="320" height="330" rx="18" fill="#dbeafe" stroke="#cbd5e1"/><text x="62" y="175" class="h">程序与轨迹</text><text x="62" y="214" class="b">人工 / 生成 / 归纳来源</text><text x="62" y="246" class="b">程序版本与参数</text><text x="62" y="278" class="b">语句 ↔ 帧 ↔ 动作</text><text x="62" y="310" class="b">状态估计器版本</text><text x="62" y="342" class="b">原始失败与修复记录</text><rect x="400" y="135" width="320" height="330" rx="18" fill="#ede9fe" stroke="#cbd5e1"/><text x="422" y="175" class="h">技能接口</text><text x="422" y="214" class="b">对象与前置条件</text><text x="422" y="246" class="b">原语序列与块边界</text><text x="422" y="278" class="b">潜在命令 / 关节命令</text><text x="422" y="310" class="b">规划与控制时间尺度</text><text x="422" y="342" class="b">完成 / 失败返回条件</text><rect x="760" y="135" width="320" height="330" rx="18" fill="#dcfce7" stroke="#cbd5e1"/><text x="782" y="175" class="h">物理响应</text><text x="782" y="214" class="b">输入状态与实际动作</text><text x="782" y="246" class="b">接触与对象后态</text><text x="782" y="278" class="b">块内失败能否返回</text><text x="782" y="310" class="b">下一技能能否接续</text><text x="782" y="342" class="b">调用成本与组合成功</text><path d="M365 295 L390 295" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M725 295 L750 295" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="40" y="520" width="1040" height="100" rx="18" fill="#ffedd5" stroke="#cbd5e1"/><text x="62" y="560" class="h">证据域保持可见</text><text x="62" y="599" class="b">生成视频、仿真执行与真实机器人分别标记；程序可运行不等于物理可执行。</text></svg>