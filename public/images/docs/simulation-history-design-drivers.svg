<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">需求、设计响应与数据证据的关系</title><desc id="desc">接触、视觉、算法比较、规模和真实迁移的需求分别推动不同技术层，并要求留下可核验的数据证据。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#326b8a"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#193547}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:17px}.line{stroke:#326b8a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1200" height="620" rx="24" fill="#fffdf8"/><text x="50" y="58" class="title">需求 → 设计响应 → 必须留下的数据证据</text><rect x="50" y="87" width="305" height="54" rx="11" fill="#dceef5" stroke="#568da9" stroke-width="2"/><text x="202" y="122" text-anchor="middle" class="label">新需求</text><rect x="447" y="87" width="305" height="54" rx="11" fill="#dceef5" stroke="#568da9" stroke-width="2"/><text x="599" y="122" text-anchor="middle" class="label">增加的技术层</text><rect x="844" y="87" width="305" height="54" rx="11" fill="#dceef5" stroke="#568da9" stroke-width="2"/><text x="996" y="122" text-anchor="middle" class="label">可核验的产物</text><rect x="50" y="155" width="305" height="69" rx="12" fill="#f5fafc" stroke="#8eafbf" stroke-width="2"/><text x="202" y="199" text-anchor="middle" class="small">接触任务</text><path d="M357 190H438" class="line"/><rect x="447" y="155" width="305" height="69" rx="12" fill="#f5fafc" stroke="#8eafbf" stroke-width="2"/><text x="599" y="199" text-anchor="middle" class="small">物理与执行器模型</text><path d="M754 190H835" class="line"/><rect x="844" y="155" width="305" height="69" rx="12" fill="#f5fafc" stroke="#8eafbf" stroke-width="2"/><text x="996" y="199" text-anchor="middle" class="small">模型、求解配置</text><rect x="50" y="243" width="305" height="69" rx="12" fill="#f5fafc" stroke="#8eafbf" stroke-width="2"/><text x="202" y="287" text-anchor="middle" class="small">视觉部署</text><path d="M357 278H438" class="line"/><rect x="447" y="243" width="305" height="69" rx="12" fill="#f5fafc" stroke="#8eafbf" stroke-width="2"/><text x="599" y="287" text-anchor="middle" class="small">传感器与真值隔离</text><path d="M754 278H835" class="line"/><rect x="844" y="243" width="305" height="69" rx="12" fill="#f5fafc" stroke="#8eafbf" stroke-width="2"/><text x="996" y="287" text-anchor="middle" class="small">标定、时间、来源</text><rect x="50" y="331" width="305" height="69" rx="12" fill="#f5fafc" stroke="#8eafbf" stroke-width="2"/><text x="202" y="375" text-anchor="middle" class="small">算法比较</text><path d="M357 366H438" class="line"/><rect x="447" y="331" width="305" height="69" rx="12" fill="#f5fafc" stroke="#8eafbf" stroke-width="2"/><text x="599" y="375" text-anchor="middle" class="small">统一任务与评测协议</text><path d="M754 366H835" class="line"/><rect x="844" y="331" width="305" height="69" rx="12" fill="#f5fafc" stroke="#8eafbf" stroke-width="2"/><text x="996" y="375" text-anchor="middle" class="small">任务与结束规则</text><rect x="50" y="419" width="305" height="69" rx="12" fill="#f5fafc" stroke="#8eafbf" stroke-width="2"/><text x="202" y="463" text-anchor="middle" class="small">规模增长</text><path d="M357 454H438" class="line"/><rect x="447" y="419" width="305" height="69" rx="12" fill="#f5fafc" stroke="#8eafbf" stroke-width="2"/><text x="599" y="463" text-anchor="middle" class="small">并行采样和记录器</text><path d="M754 454H835" class="line"/><rect x="844" y="419" width="305" height="69" rx="12" fill="#f5fafc" stroke="#8eafbf" stroke-width="2"/><text x="996" y="463" text-anchor="middle" class="small">变体、episode 血缘</text><rect x="50" y="507" width="305" height="69" rx="12" fill="#f5fafc" stroke="#8eafbf" stroke-width="2"/><text x="202" y="551" text-anchor="middle" class="small">真实迁移</text><path d="M357 542H438" class="line"/><rect x="447" y="507" width="305" height="69" rx="12" fill="#f5fafc" stroke="#8eafbf" stroke-width="2"/><text x="599" y="551" text-anchor="middle" class="small">校准和留出评测</text><path d="M754 542H835" class="line"/><rect x="844" y="507" width="305" height="69" rx="12" fill="#f5fafc" stroke="#8eafbf" stroke-width="2"/><text x="996" y="551" text-anchor="middle" class="small">域差距与失败报告</text></svg>