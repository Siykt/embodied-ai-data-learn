<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">抓取杯子的仿真数据链路</title><desc id="desc">抓取任务从目标定义开始，经过资产、物理、观测、任务变体、记录和真实验证。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#326b8a"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#193547}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:17px}.line{stroke:#326b8a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1200" height="580" rx="24" fill="#fffdf8"/><text x="50" y="58" class="title">一个抓取杯子的任务如何贯穿全链路</text><rect x="50" y="115" width="235" height="145" rx="16" fill="#e3f1f7" stroke="#568da9" stroke-width="2"/><text x="167" y="175" text-anchor="middle" class="label">任务</text><text x="167" y="220" text-anchor="middle" class="small">稳定抓起两秒</text><path d="M287 187H336" class="line"/><rect x="345" y="115" width="235" height="145" rx="16" fill="#e3f1f7" stroke="#568da9" stroke-width="2"/><text x="462" y="175" text-anchor="middle" class="label">资产</text><text x="462" y="220" text-anchor="middle" class="small">杯子与夹爪模型</text><path d="M582 187H631" class="line"/><rect x="640" y="115" width="235" height="145" rx="16" fill="#e3f1f7" stroke="#568da9" stroke-width="2"/><text x="757" y="175" text-anchor="middle" class="label">物理</text><text x="757" y="220" text-anchor="middle" class="small">摩擦与控制</text><path d="M877 187H926" class="line"/><rect x="935" y="115" width="235" height="145" rx="16" fill="#e3f1f7" stroke="#568da9" stroke-width="2"/><text x="1052" y="175" text-anchor="middle" class="label">观测</text><text x="1052" y="220" text-anchor="middle" class="small">相机与接触</text><path d="M1052 262V355" class="line"/><rect x="935" y="360" width="235" height="145" rx="16" fill="#e3f1f7" stroke="#568da9" stroke-width="2"/><text x="1052" y="420" text-anchor="middle" class="label">变体</text><text x="1052" y="465" text-anchor="middle" class="small">位置材质光照</text><path d="M926 432H878" stroke="#326b8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="640" y="360" width="235" height="145" rx="16" fill="#e3f1f7" stroke="#568da9" stroke-width="2"/><text x="757" y="420" text-anchor="middle" class="label">记录</text><text x="757" y="465" text-anchor="middle" class="small">episode 与动作</text><path d="M631 432H583" stroke="#326b8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="345" y="360" width="235" height="145" rx="16" fill="#e3f1f7" stroke="#568da9" stroke-width="2"/><text x="462" y="420" text-anchor="middle" class="label">验证</text><text x="462" y="465" text-anchor="middle" class="small">留出物体和真机</text><text x="50" y="553" class="small">每一步都能指出输入、版本、输出和失败原因，才形成可复用数据</text></svg>