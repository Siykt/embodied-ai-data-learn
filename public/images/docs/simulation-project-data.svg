<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 723" role="img" aria-labelledby="title desc"><title id="title">操作记录中的输入、动作结果与评价信息</title><desc id="desc">策略读取视觉触觉状态和指令；记录器保存动作和结果；FEM内部信息单独用于评价。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#377d75"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif"><rect width="720" height="723" rx="22" fill="#fcfcf8"/><text x="32" y="49" font-size="29" font-weight="700" fill="#254044">同一次抓取，记录三类信息</text><rect x="28" y="88" width="664" height="165" rx="16" fill="#edf6f4" stroke="#b6d5ce" stroke-width="2"/><text x="50" y="128" font-size="27" font-weight="700" fill="#254044">01  策略的输入</text><text x="50" y="175" font-size="23" font-weight="400" fill="#254044">两路相机、左右手指触觉、机器人状态</text><text x="50" y="216" font-size="23" font-weight="400" fill="#254044">加上任务指令：把糕点放进篮子</text><path d="M360 257 V280" fill="none" stroke="#377d75" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="293" width="664" height="165" rx="16" fill="#edf3fa" stroke="#b9cce1" stroke-width="2"/><text x="50" y="333" font-size="27" font-weight="700" fill="#254044">02  动作与执行结果</text><text x="50" y="380" font-size="23" font-weight="400" fill="#254044">下一步位置、朝向、单指开度</text><text x="50" y="421" font-size="23" font-weight="400" fill="#254044">执行后记录新状态，按时间与动作配对</text><rect x="28" y="495" width="664" height="153" rx="16" fill="#fff3e5" stroke="#dec6a8" stroke-width="2"/><text x="50" y="535" font-size="26" font-weight="700" fill="#254044">03  评价器读取的内部信息</text><text x="50" y="577" font-size="23" font-weight="400" fill="#254044">物体内部节点形变 → 整段过程的最大值</text><text x="50" y="616" font-size="21" font-weight="400" fill="#254044">这些内部信息不直接交给公开策略输入</text><text x="32" y="692" font-size="22" font-weight="400" fill="#254044">采集了什么，与训练用了什么，需要分别核对。</text></g></svg>