<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">世界模型数据与证据追溯关系</title><desc id="desc">从传感器观测和动作开始，关联模型预测与真实执行结果，再汇总为评估证据；每一项都绑定版本和时间戳。</desc>
<rect width="1200" height="460" rx="28" fill="#f5f7fb"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#15223b">每个预测都应能追溯到动作和真实后果</text>
<g font-family="sans-serif" text-anchor="middle"><g><rect x="56" y="156" width="214" height="150" rx="20" fill="#e5effa" stroke="#a9c5e5" stroke-width="2"/><text x="163" y="207" font-size="22" font-weight="700" fill="#175b9d">观测与状态</text><text x="163" y="246" font-size="16" fill="#334155">图像 · 本体状态</text><text x="163" y="275" font-size="15" fill="#53627a">时间戳 / episode</text></g>
<g><rect x="342" y="156" width="214" height="150" rx="20" fill="#e5effa" stroke="#a9c5e5" stroke-width="2"/><text x="449" y="207" font-size="22" font-weight="700" fill="#175b9d">动作条件</text><text x="449" y="246" font-size="16" fill="#334155">命令 · 单位 · 坐标系</text><text x="449" y="275" font-size="15" fill="#53627a">发送与生效时间</text></g>
<g><rect x="628" y="156" width="214" height="150" rx="20" fill="#eee9f8" stroke="#c6b5df" stroke-width="2"/><text x="735" y="207" font-size="22" font-weight="700" fill="#7351a1">模型预测</text><text x="735" y="246" font-size="16" fill="#334155">未来状态 / 视频</text><text x="735" y="275" font-size="15" fill="#53627a">模型 revision / 置信度</text></g>
<g><rect x="914" y="156" width="230" height="150" rx="20" fill="#e5f3ec" stroke="#a9d6c1" stroke-width="2"/><text x="1029" y="207" font-size="22" font-weight="700" fill="#177458">真实执行结果</text><text x="1029" y="246" font-size="16" fill="#334155">观测后态 · 成败 · 接触</text><text x="1029" y="275" font-size="15" fill="#53627a">重规划与延迟</text></g>
</g><g stroke="#8294ad" stroke-width="4" fill="none"><path d="M270 231H335"/><path d="M556 231H621"/><path d="M842 231H907"/></g><g fill="#8294ad"><path d="M335 223l14 8-14 8z"/><path d="M621 223l14 8-14 8z"/><path d="M907 223l14 8-14 8z"/></g>
<rect x="192" y="355" width="816" height="54" rx="16" fill="#192b49"/><text x="600" y="390" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fff">评估记录同时关联数据来源、切分方案、采样预算与许可证</text></svg>
