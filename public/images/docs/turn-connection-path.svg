<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">WebRTC 连接从直连失败到 TURN 中继的路径</title>
  <desc id="desc">浏览器和机器人位于不同 NAT 网络时，通过 TURN 服务器中继实时媒体与控制数据。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356ae6"/></marker>
    <style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#172033}.label{font-size:24px;font-weight:700}.small{font-size:18px}.box{fill:#f7f9fc;stroke:#aebbd2;stroke-width:3}.nat{fill:#fff7e6;stroke:#d28b24;stroke-width:3}.turn{fill:#eaf1ff;stroke:#356ae6;stroke-width:3}</style>
  </defs>
  <rect width="1200" height="420" fill="#fff"/>
  <rect x="35" y="50" width="310" height="300" rx="18" class="nat"/>
  <rect x="855" y="50" width="310" height="300" rx="18" class="nat"/>
  <text x="190" y="92" text-anchor="middle" class="label">采集端网络</text>
  <text x="1010" y="92" text-anchor="middle" class="label">机器人网络</text>
  <rect x="95" y="150" width="190" height="80" rx="12" class="box"/><text x="190" y="199" text-anchor="middle" class="label">浏览器 / 控制端</text>
  <rect x="925" y="150" width="190" height="80" rx="12" class="box"/><text x="1020" y="199" text-anchor="middle" class="label">机器人 / 设备端</text>
  <text x="190" y="285" text-anchor="middle" class="small">NAT / 防火墙</text><text x="1010" y="285" text-anchor="middle" class="small">NAT / 防火墙</text>
  <rect x="470" y="125" width="260" height="130" rx="18" class="turn"/><text x="600" y="180" text-anchor="middle" class="label">TURN 服务器</text><text x="600" y="216" text-anchor="middle" class="small">公网中继地址</text>
  <path d="M285 190H465" stroke="#356ae6" stroke-width="6" marker-end="url(#arrow)"/><path d="M735 190H915" stroke="#356ae6" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M190 245C390 380 810 380 1020 245" fill="none" stroke="#7d8ba6" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="600" y="375" text-anchor="middle" class="small">优先尝试端到端直连；失败时由 TURN 转发媒体与控制流</text>
</svg>
