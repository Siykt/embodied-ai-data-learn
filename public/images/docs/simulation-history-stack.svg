<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc"><title id="title">具身仿真的五层系统</title><desc id="desc">场景、物理与传感器、任务、记录器、评测逐层构成可复现数据生产链路。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#326b8a"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#193547}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:17px}.line{stroke:#326b8a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1200" height="655" rx="24" fill="#fffdf8"/><text x="55" y="58" class="title">具身仿真是一套分层的实验系统</text><rect x="72" y="95" width="1050" height="78" rx="15" fill="#e3f1f7" stroke="#568da9" stroke-width="2"/><text x="100" y="127" class="label">场景与资产</text><text x="360" y="127" class="small">机器人、物体、几何、坐标</text><text x="360" y="154" class="small">决定世界是什么</text><path d="M597 174v23" class="line"/><rect x="72" y="199" width="1050" height="78" rx="15" fill="#f4fafc" stroke="#568da9" stroke-width="2"/><text x="100" y="231" class="label">物理与传感器</text><text x="360" y="231" class="small">动力学、接触、相机、IMU</text><text x="360" y="258" class="small">决定动作之后可看到什么</text><path d="M597 278v23" class="line"/><rect x="72" y="303" width="1050" height="78" rx="15" fill="#f4fafc" stroke="#568da9" stroke-width="2"/><text x="100" y="335" class="label">任务环境</text><text x="360" y="335" class="small">重置、观测、动作、成功</text><text x="360" y="362" class="small">决定一次实验如何进行</text><path d="M597 382v23" class="line"/><rect x="72" y="407" width="1050" height="78" rx="15" fill="#f4fafc" stroke="#568da9" stroke-width="2"/><text x="100" y="439" class="label">数据记录器</text><text x="360" y="439" class="small">时间戳、episode、来源</text><text x="360" y="466" class="small">决定轨迹能否复用</text><path d="M597 486v23" class="line"/><rect x="72" y="511" width="1050" height="78" rx="15" fill="#e3f1f7" stroke="#568da9" stroke-width="2"/><text x="100" y="543" class="label">评测与真实对照</text><text x="360" y="543" class="small">质量、划分、失败、迁移</text><text x="360" y="570" class="small">决定结论能否相信</text><text x="55" y="630" class="small">所有层的配置与版本都进入数据血缘</text></svg>