<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc">
  <title id="title">移动设备 IMU 采集和数据封装流程</title>
  <desc id="desc">图示手机或平板上的加速度计和陀螺仪经过采样、同一时钟时间戳、会话记录和离线处理后，形成可与视频和机器人状态对齐的具身智能数据。</desc>
  <defs>
    <style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.data{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.check{fill:#ecfdf5;stroke:#059669;stroke-width:2}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.txt{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#0f172a}.title{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:700}.small{font-size:16px;fill:#475569}.arrow{stroke:#334155;stroke-width:3;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker>
  </defs>
  <rect class="bg" width="1080" height="440"/>
  <text class="txt title" x="42" y="52">移动设备 IMU：从原始读数到可复用的数据集</text>
  <g transform="translate(44 94)">
    <rect class="box" width="186" height="122" rx="8"/><text class="txt label" x="45" y="42">设备传感器</text><text class="txt small" x="24" y="74">加速度计 ax, ay, az</text><text class="txt small" x="24" y="102">陀螺仪 gx, gy, gz</text>
    <line class="arrow" x1="198" y1="61" x2="276" y2="61"/>
    <rect class="data" x="288" width="190" height="122" rx="8"/><text class="txt label" x="332" y="42">采集会话</text><text class="txt small" x="310" y="74">单调时间戳 (ns)</text><text class="txt small" x="310" y="102">采样率 / 精度 / 设备</text>
    <line class="arrow" x1="490" y1="61" x2="568" y2="61"/>
    <rect class="data" x="580" width="190" height="122" rx="8"/><text class="txt label" x="628" y="42">原始记录</text><text class="txt small" x="604" y="74">IMU 流 + 视频帧</text><text class="txt small" x="604" y="102">动作 / 任务事件</text>
    <line class="arrow" x1="782" y1="61" x2="860" y2="61"/>
    <rect class="check" x="872" width="164" height="122" rx="8"/><text class="txt label" x="910" y="42">数据包</text><text class="txt small" x="895" y="74">对齐索引</text><text class="txt small" x="895" y="102">元数据清单</text>
    <rect class="warn" x="178" y="212" width="682" height="88" rx="8"/><text class="txt label" x="206" y="249">现场必须同时记录的条件</text><text class="txt small" x="206" y="278">设备型号和 OS、传感器类型、屏幕方向、安装姿态、时间基准、丢样与热状态</text>
    <line class="arrow" x1="520" y1="122" x2="520" y2="200"/>
  </g>
</svg>
