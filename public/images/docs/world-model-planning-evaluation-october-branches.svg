<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">规划评估：从共同起点到可归因结果</title><desc id="desc">共同初始状态分别进入目标组合留出、层级候选和策略噪声候选，最终与同动作真实执行配对。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:650}.b{font-size:20px}.s{font-size:18px;fill:#475569}.white{font-size:20px;fill:white}</style><rect width="1120" height="680" rx="24" fill="#f8fafc"/><text x="40" y="56" class="t">规划评估：从共同起点到可归因结果</text><text x="40" y="94" class="s">目标、候选分布和计算预算都是评测条件。</text><rect x="40" y="235" width="250" height="165" rx="18" fill="#dbeafe" stroke="#cbd5e1"/><text x="62" y="275" class="h">共同起点</text><text x="62" y="314" class="b">观测 + 目标版本</text><text x="62" y="346" class="b">动作单位 + 时间</text><rect x="375" y="125" width="390" height="100" rx="18" fill="#ede9fe" stroke="#cbd5e1"/><text x="397" y="165" class="h">目标组合留出</text><text x="397" y="204" class="b">已见因素，新组合；动力学不变</text><rect x="375" y="270" width="390" height="100" rx="18" fill="#cffafe" stroke="#cbd5e1"/><text x="397" y="310" class="h">层级候选</text><text x="397" y="349" class="b">层级、跨度、父子目标</text><rect x="375" y="415" width="390" height="100" rx="18" fill="#ffedd5" stroke="#cbd5e1"/><text x="397" y="455" class="h">策略噪声候选</text><text x="397" y="494" class="b">种子 → 动作 → 预测分数</text><rect x="830" y="235" width="250" height="165" rx="18" fill="#dcfce7" stroke="#cbd5e1"/><text x="852" y="275" class="h">执行证据</text><text x="852" y="314" class="b">同动作真实轨迹</text><text x="852" y="346" class="b">接触区 + 阶段结果</text><path d="M295 275 L365 175" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M295 315 L365 320" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M295 355 L365 465" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M770 175 L820 275" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M770 320 L820 315" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M770 465 L820 355" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="40" y="545" width="1040" height="100" rx="18" fill="#ffedd5" stroke="#cbd5e1"/><text x="62" y="585" class="h">同时报告四项</text><text x="62" y="624" class="b">预测误差、候选排序、闭环结果、规划预算；不要把一种改善当成全部改善。</text></svg>