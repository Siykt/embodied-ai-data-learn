<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">具身数据引擎飞轮</title>
  <desc id="desc">任务生成、数据采集、验证、训练、部署和反馈六个阶段组成闭环，每个阶段保留版本与数据血缘。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#356b8c"/></marker>
    <style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#173042}.stage{fill:#e3f1f7;stroke:#2f7294;stroke-width:3}.small{font-size:18px}.label{font-size:24px;font-weight:700}.line{stroke:#356b8c;stroke-width:3;fill:none;marker-end:url(#arrow)}.trace{stroke:#d08a22;stroke-width:3;fill:none;stroke-dasharray:10 8}</style>
  </defs>
  <rect width="1280" height="720" rx="26" fill="#fffdf8"/>
  <text x="60" y="58" class="label">具身数据引擎飞轮：六阶段闭环与版本追溯</text>
  <circle cx="640" cy="365" r="205" fill="none" stroke="#d8e8ee" stroke-width="44"/>
  <rect x="505" y="300" width="270" height="125" rx="18" fill="#fff4db" stroke="#d08a22" stroke-width="3"/><text x="640" y="345" text-anchor="middle" class="label">评估信号</text><text x="640" y="383" text-anchor="middle" class="small">失败簇、漂移、反馈</text>
  <rect x="495" y="100" width="290" height="105" rx="16" class="stage"/><text x="640" y="142" text-anchor="middle" class="label">1 任务生成</text><text x="640" y="176" text-anchor="middle" class="small">规格、参数、seed、版本</text>
  <rect x="865" y="220" width="290" height="105" rx="16" class="stage"/><text x="1010" y="262" text-anchor="middle" class="label">2 数据采集</text><text x="1010" y="296" text-anchor="middle" class="small">观测、动作、状态、事件</text>
  <rect x="865" y="440" width="290" height="105" rx="16" class="stage"/><text x="1010" y="482" text-anchor="middle" class="label">3 验证</text><text x="1010" y="516" text-anchor="middle" class="small">对齐、回放、质量、授权</text>
  <rect x="495" y="560" width="290" height="105" rx="16" class="stage"/><text x="640" y="602" text-anchor="middle" class="label">4 训练与评估</text><text x="640" y="636" text-anchor="middle" class="small">数据快照、指标、失败模式</text>
  <rect x="125" y="440" width="290" height="105" rx="16" class="stage"/><text x="270" y="482" text-anchor="middle" class="label">5 部署</text><text x="270" y="516" text-anchor="middle" class="small">现场 rollout、安全与延迟</text>
  <rect x="125" y="220" width="290" height="105" rx="16" class="stage"/><text x="270" y="262" text-anchor="middle" class="label">6 反馈</text><text x="270" y="296" text-anchor="middle" class="small">分布、接管、下一轮队列</text>
  <path d="M785 153h75M1155 325v105M865 545H785M495 612H415M125 425V325" class="line"/>
  <path d="M415 220h80M785 665h80" class="line"/>
  <path d="M640 205v85M865 272H785M865 492H785M640 560v-135M495 612H415M415 272H495" class="trace" marker-end="url(#arrow)"/>
  <text x="60" y="695" class="small">每阶段输出：原始数据或日志 + 质量结论 + 版本 / 哈希 + 来源与 split；反馈只能进入下一轮队列，不能绕过评估隔离。</text>
</svg>
