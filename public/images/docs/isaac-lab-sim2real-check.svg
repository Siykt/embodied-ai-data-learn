<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Isaac Lab 仿真到真实数据的差异检查</title>
  <desc id="desc">比较仿真和真实世界在观测、动力学、控制和任务分布上的差异，并回写数据策略。</desc>
  <defs><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#173042}.box{fill:#f8fbfc;stroke:#8aaebe;stroke-width:2}.head{font-size:26px;font-weight:700}.body{font-size:21px}.arrow{stroke:#356b8c;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#356b8c"/></marker></defs>
  <rect width="1200" height="500" rx="24" fill="#fffdf8"/>
  <rect x="80" y="145" width="260" height="150" rx="16" class="box"/><text x="210" y="192" text-anchor="middle" class="head">仿真数据</text><text x="210" y="230" text-anchor="middle" class="body">可控、规模大、标签全</text><text x="210" y="265" text-anchor="middle" class="body">但可能过于理想化</text>
  <rect x="470" y="95" width="260" height="250" rx="16" fill="#e3f1f7" stroke="#2f7294" stroke-width="3"/><text x="600" y="145" text-anchor="middle" class="head">差异检查</text><text x="600" y="190" text-anchor="middle" class="body">相机噪声与曝光</text><text x="600" y="225" text-anchor="middle" class="body">动力学与接触</text><text x="600" y="260" text-anchor="middle" class="body">控制频率与延迟</text><text x="600" y="295" text-anchor="middle" class="body">任务与场景分布</text>
  <rect x="860" y="145" width="260" height="150" rx="16" class="box"/><text x="990" y="192" text-anchor="middle" class="head">真实数据</text><text x="990" y="230" text-anchor="middle" class="body">少量、昂贵、含失败</text><text x="990" y="265" text-anchor="middle" class="body">用于校准与最终验证</text>
  <path d="M340 220h120M740 220h120" class="arrow"/>
  <path d="M990 300v95H210v-100" class="arrow" stroke-dasharray="8 8"/>
  <text x="600" y="438" text-anchor="middle" class="body">真实采集结果应反馈到随机化、传感器模型、任务采样和验收阈值。</text>
</svg>
