<text x="274" y="207" text-anchor="start" fill="#54718a" font-size="18" font-weight="700" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif">02</text>
<text x="274" y="252" text-anchor="start" fill="#213548" font-size="23" font-weight="700" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif">多源采集</text>
<text x="274" y="289" text-anchor="start" fill="#526b7f" font-size="17" font-weight="400" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif">视频/命令/状态</text>
<path d="M 446 244 L 468 244" stroke="#7892a7" stroke-width="3"/>
