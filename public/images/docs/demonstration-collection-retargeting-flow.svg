<rect x="471" y="160" width="185" height="170" rx="17" fill="#fff0db" stroke="#cddde9"/>
<text x="487" y="207" text-anchor="start" fill="#54718a" font-size="18" font-weight="700" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif">03</text>
<text x="487" y="252" text-anchor="start" fill="#213548" font-size="23" font-weight="700" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif">时空对齐</text>
<text x="487" y="289" text-anchor="start" fill="#526b7f" font-size="17" font-weight="400" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif">时钟与坐标</text>
<path d="M 659 244 L 681 244" stroke="#7892a7" stroke-width="3"/>
