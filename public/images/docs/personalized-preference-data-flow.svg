<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">个性化偏好：同一目标下的成对执行</title><desc id="desc">把任务完成与执行方式分开；场景需要编辑时保留修改证据。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#a4512e" stroke-width="1.7"/></marker></defs>
<rect width="1120" height="620" rx="22" fill="#f3f8fc"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="45" fill="#17324d" font-size="28" font-weight="700">个性化偏好：同一目标下的成对执行</text>
<text x="32" y="77" fill="#466178" font-size="18">把任务完成与执行方式分开；场景需要编辑时保留修改证据。</text>
<rect x="32" y="197" width="250" height="153" rx="15" fill="#fff" stroke="#237a73" stroke-width="1.8"/>
<text x="50" y="231" fill="#17324d" font-size="21" font-weight="700" text-anchor="start">任务与可比布局</text>
<text x="50" y="262" fill="#466178" font-size="18" font-weight="400" text-anchor="start">相同目标条件</text>
<text x="50" y="289" fill="#466178" font-size="18" font-weight="400" text-anchor="start">对象、场景及控制配置</text>
<text x="50" y="316" fill="#466178" font-size="18" font-weight="400" text-anchor="start">偏好原文与适用区间</text>
<rect x="366" y="115" width="303" height="139" rx="15" fill="#fff" stroke="#237a73" stroke-width="1.8"/>
<text x="384" y="149" fill="#17324d" font-size="21" font-weight="700" text-anchor="start">无偏好对照</text>
<text x="384" y="180" fill="#466178" font-size="18" font-weight="400" text-anchor="start">不施加目标偏好</text>
<text x="384" y="207" fill="#466178" font-size="18" font-weight="400" text-anchor="start">记录实际动作与任务结果</text>
<rect x="366" y="306" width="303" height="139" rx="15" fill="#fff" stroke="#237a73" stroke-width="1.8"/>
<text x="384" y="340" fill="#17324d" font-size="21" font-weight="700" text-anchor="start">偏好条件执行</text>
<text x="384" y="371" fill="#466178" font-size="18" font-weight="400" text-anchor="start">加入运动 / 技能 / 背景要求</text>
<text x="384" y="398" fill="#466178" font-size="18" font-weight="400" text-anchor="start">保留解释及场景编辑</text>
<rect x="755" y="197" width="333" height="153" rx="15" fill="#fff" stroke="#237a73" stroke-width="1.8"/>
<text x="773" y="231" fill="#17324d" font-size="21" font-weight="700" text-anchor="start">两个独立结果</text>
<text x="773" y="262" fill="#466178" font-size="18" font-weight="400" text-anchor="start">task_success：目标是否完成</text>
<text x="773" y="289" fill="#466178" font-size="18" font-weight="400" text-anchor="start">satisfaction：方式是否符合</text>
<text x="773" y="316" fill="#466178" font-size="18" font-weight="400" text-anchor="start">关联原始轨迹与指标版本</text>
<path d="M282 250L363 183" stroke="#a4512e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M282 296L363 375" stroke="#a4512e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M669 183L752 250" stroke="#a4512e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M669 375L752 296" stroke="#a4512e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="32" y="500" width="1056" height="80" rx="14" fill="#e2efec"/>
<text x="52" y="529" fill="#17324d" font-size="20" font-weight="700" text-anchor="start">配对依据</text>
<text x="52" y="558" fill="#466178" font-size="18" font-weight="400" text-anchor="start">用任务、布局、偏好条件与动作阶段关联；长度相近不代表可比。</text>
</g>
</svg>