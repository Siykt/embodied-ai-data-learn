<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">VLM 与 VLA 协作的具身智能闭环</title>
  <desc id="desc">VLM 负责理解、规划和工具调用，VLA 负责把子任务转换为机器人动作，执行结果回流形成闭环。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="520" rx="28" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="60" y="62" font-size="28" font-weight="700">VLM → VLA → 机器人执行闭环</text>
    <text x="60" y="94" font-size="17" fill="#475569">高层语义与空间推理，不等于低层动作控制；两者要通过可追踪的任务接口连接。</text>
    <rect x="70" y="180" width="250" height="170" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="105" y="225" font-size="25" font-weight="700">VLM / ER</text>
    <text x="105" y="260" font-size="17">看懂场景与指令</text><text x="105" y="288" font-size="17">空间关系、规划、工具</text><text x="105" y="316" font-size="17">拆解任务、估计进度</text>
    <rect x="475" y="180" width="250" height="170" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="510" y="225" font-size="25" font-weight="700">VLA</text>
    <text x="510" y="260" font-size="17">图像 + 语言 + 状态</text><text x="510" y="288" font-size="17">预测动作或动作块</text><text x="510" y="316" font-size="17">按反馈重新规划</text>
    <rect x="880" y="180" width="250" height="170" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <text x="915" y="225" font-size="25" font-weight="700">机器人 / 环境</text>
    <text x="915" y="260" font-size="17">执行动作与安全约束</text><text x="915" y="288" font-size="17">产生新观测与状态</text><text x="915" y="316" font-size="17">记录成功、失败、风险</text>
    <path d="M325 265H465" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/><path d="M730 265H870" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1005 365V440H195V365" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="465" y="420" font-size="18" fill="#475569">观测、动作、时间戳、质量标记与任务进度回流</text>
  </g>
</svg>
