<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">VRS 的流与记录模型</title>
  <desc id="desc">图示一个 VRS 文件包含多个传感器流；每个流按共同时间域记录配置、状态和数据记录，记录中可包含元数据、图像、音频或自定义内容块。</desc>
  <defs>
    <style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.camera{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.imu{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.audio{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.config{fill:#fef3c7;stroke:#d97706;stroke-width:2}.state{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.data{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.title{font:700 30px Arial,"Noto Sans SC",sans-serif;fill:#0f172a}.h{font:700 21px Arial,"Noto Sans SC",sans-serif;fill:#0f172a}.t{font:17px Arial,"Noto Sans SC",sans-serif;fill:#334155}.s{font:15px Arial,"Noto Sans SC",sans-serif;fill:#475569}.line{stroke:#64748b;stroke-width:3;fill:none}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7}</style>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text class="title" x="60" y="60">VRS：一个文件内的多流、记录与时间关系</text>
  <rect class="panel" x="60" y="95" width="250" height="470" rx="8"/>
  <text class="h" x="122" y="138">recording.vrs</text>
  <text class="s" x="92" y="170">文件级标签与索引</text>
  <rect class="camera" x="90" y="205" width="190" height="66" rx="6"/><text class="h" x="137" y="233">RGB stream</text><text class="s" x="110" y="257">相机标识、格式、帧记录</text>
  <rect class="camera" x="90" y="296" width="190" height="66" rx="6"/><text class="h" x="130" y="324">SLAM stream</text><text class="s" x="108" y="348">双目或计算机视觉相机</text>
  <rect class="imu" x="90" y="387" width="190" height="66" rx="6"/><text class="h" x="144" y="415">IMU stream</text><text class="s" x="108" y="439">加速度与角速度样本</text>
  <rect class="audio" x="90" y="478" width="190" height="56" rx="6"/><text class="h" x="130" y="512">Audio stream</text>
  <path class="line" d="M310 237 L382 237 M310 328 L382 328 M310 420 L382 420 M310 506 L382 506"/>
  <rect class="panel" x="382" y="95" width="758" height="470" rx="8"/>
  <text class="h" x="420" y="138">每个 stream 的记录序列：共享时间域，但采样率可不同</text>
  <path class="line" d="M460 485 L1080 485"/>
  <path class="line" d="M1080 485 l-12 -8 M1080 485 l-12 8"/>
  <text class="s" x="945" y="516">timestamp 增大</text>
  <path class="dash" d="M562 165 L562 470 M730 165 L730 470 M910 165 L910 470"/>
  <rect class="config" x="430" y="183" width="180" height="94" rx="6"/><text class="h" x="474" y="216">Configuration</text><text class="s" x="455" y="244">一次或按变化写入</text><text class="s" x="452" y="265">分辨率、单位、内参等</text>
  <rect class="state" x="650" y="183" width="148" height="94" rx="6"/><text class="h" x="684" y="216">State</text><text class="s" x="675" y="244">状态变化</text><text class="s" x="670" y="265">例如设备模式</text>
  <rect class="data" x="835" y="183" width="245" height="94" rx="6"/><text class="h" x="924" y="216">Data</text><text class="s" x="857" y="244">逐帧图像、IMU 样本、音频包</text><text class="s" x="857" y="265">每条记录带 timestamp</text>
  <text class="h" x="430" y="336">记录内容块</text>
  <rect class="panel" x="430" y="360" width="145" height="70" rx="6"/><text class="t" x="458" y="402">Metadata</text>
  <rect class="panel" x="605" y="360" width="125" height="70" rx="6"/><text class="t" x="643" y="402">Image</text>
  <rect class="panel" x="760" y="360" width="125" height="70" rx="6"/><text class="t" x="798" y="402">Audio</text>
  <rect class="panel" x="915" y="360" width="165" height="70" rx="6"/><text class="t" x="942" y="402">Custom block</text>
  <text class="s" x="430" y="552">工程含义：先读取 stream 身份、配置和时间戳，再解释数据载荷；不能把不同流的序号当成同一时刻。</text>
</svg>
