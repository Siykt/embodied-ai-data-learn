<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Isaac Lab 在具身数据闭环中的位置</title>
  <desc id="desc">仿真场景和传感器生成观测，策略产生动作，记录器形成 episode，质量检查后用于训练和真实世界迁移。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#356b8c"/></marker>
    <style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#173042} .box{fill:#f5fafc;stroke:#6d9db7;stroke-width:2} .main{fill:#e3f1f7;stroke:#2f7294;stroke-width:3} .small{font-size:20px} .label{font-size:25px;font-weight:700} .line{stroke:#356b8c;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#fffdf8"/>
  <text x="60" y="58" class="label">Isaac Lab：从仿真交互到可复用具身数据</text>
  <rect x="65" y="120" width="220" height="125" rx="16" class="box"/><text x="175" y="164" text-anchor="middle" class="label">场景与资产</text><text x="175" y="202" text-anchor="middle" class="small">机器人、物体、任务</text>
  <rect x="340" y="120" width="220" height="125" rx="16" class="main"/><text x="450" y="164" text-anchor="middle" class="label">Isaac Lab</text><text x="450" y="202" text-anchor="middle" class="small">物理 + 传感器 + 环境</text>
  <rect x="615" y="120" width="220" height="125" rx="16" class="box"/><text x="725" y="164" text-anchor="middle" class="label">策略交互</text><text x="725" y="202" text-anchor="middle" class="small">观测 → 动作 → 状态</text>
  <rect x="890" y="120" width="245" height="125" rx="16" class="box"/><text x="1012" y="164" text-anchor="middle" class="label">数据记录</text><text x="1012" y="202" text-anchor="middle" class="small">episode / trajectory</text>
  <path d="M285 182h45M560 182h55M835 182h55" class="line"/>
  <rect x="190" y="350" width="240" height="125" rx="16" class="box"/><text x="310" y="394" text-anchor="middle" class="label">质量检查</text><text x="310" y="432" text-anchor="middle" class="small">边界、同步、接触、成功率</text>
  <rect x="480" y="350" width="240" height="125" rx="16" class="box"/><text x="600" y="394" text-anchor="middle" class="label">训练与评估</text><text x="600" y="432" text-anchor="middle" class="small">RL / 模仿学习 / 回放</text>
  <rect x="770" y="350" width="240" height="125" rx="16" class="box"/><text x="890" y="394" text-anchor="middle" class="label">真实世界验证</text><text x="890" y="432" text-anchor="middle" class="small">sim-to-real 与差异分析</text>
  <path d="M1012 245v55H310v50M430 412h50M720 412h50" class="line"/>
  <path d="M890 350V285H450V245" class="line" stroke-dasharray="8 8"/>
</svg>
