<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Ego4D 数据格式：规范化视频、元数据和任务标注</title>
  <desc id="desc">图示 Ego4D 从原始 video components 生成 canonical videos 和 clips，再通过 ego4d.json 与 benchmark annotation JSON 连接到训练样本。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.video{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.json{fill:#fef3c7;stroke:#d97706;stroke-width:2}.clip{fill:#ecfdf5;stroke:#059669;stroke-width:2}.title{font:700 30px Arial,"Noto Sans SC",sans-serif;fill:#0f172a}.h{font:700 22px Arial,"Noto Sans SC",sans-serif;fill:#0f172a}.t{font:18px Arial,"Noto Sans SC",sans-serif;fill:#334155}.small{font:15px Arial,"Noto Sans SC",sans-serif;fill:#475569}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="640"/>
  <text class="title" x="60" y="62">Ego4D：以视频为主轴，用 JSON 描述内容、切片和标注</text>
  <rect class="panel" x="60" y="120" width="250" height="360" rx="8"/>
  <text class="h" x="96" y="165">Video Components</text>
  <text class="t" x="92" y="210">采集机构提交的原始片段</text>
  <text class="small" x="96" y="244">设备、帧率、音频和时基可能不一致</text>
  <rect class="video" x="100" y="300" width="170" height="82" rx="6"/>
  <text class="t" x="133" y="334">component</text>
  <text class="small" x="124" y="362">raw source segment</text>
  <rect class="panel" x="455" y="100" width="290" height="170" rx="8"/>
  <text class="h" x="508" y="145">Canonical Video</text>
  <text class="t" x="510" y="185">标准化长视频</text>
  <text class="small" x="493" y="218">30 FPS、统一音视频处理、主消费对象</text>
  <rect class="panel" x="455" y="360" width="290" height="170" rx="8"/>
  <text class="h" x="522" y="405">Canonical Clips</text>
  <text class="t" x="502" y="445">任务标注关联的训练切片</text>
  <text class="small" x="493" y="478">字段常用 video_* 与 clip_* 区分时间轴</text>
  <rect class="panel" x="890" y="120" width="250" height="360" rx="8"/>
  <text class="h" x="952" y="165">JSON 索引</text>
  <rect class="json" x="920" y="198" width="180" height="52" rx="6"/>
  <text class="t" x="961" y="231">ego4d.json</text>
  <rect class="json" x="920" y="274" width="180" height="52" rx="6"/>
  <text class="t" x="953" y="307">annotations/*.json</text>
  <rect class="clip" x="920" y="350" width="180" height="52" rx="6"/>
  <text class="t" x="950" y="383">benchmark split</text>
  <path class="arrow" d="M310 300 C370 245 395 190 451 185"/>
  <path class="arrow" d="M600 270 L600 356"/>
  <path class="arrow" d="M745 185 C800 185 830 205 886 224"/>
  <path class="arrow" d="M745 445 C800 425 830 380 886 376"/>
  <text class="small" x="78" y="556">训练读取建议：先用 ego4d.json 按 video_uid 过滤设备、场景、split 和质量，再按任务 annotation 中的 clip/video 时间字段裁剪样本。</text>
</svg>
