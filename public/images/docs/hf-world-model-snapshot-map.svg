<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Hugging Face 具身世界模型快照分类图</title><desc id="desc">快照把 Hugging Face 内容分为模型、数据集与评测、Space 演示和论文来源，并以具身交互任务为中心。</desc>
<rect width="1200" height="620" rx="28" fill="#f5f7fb"/><text x="600" y="64" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#15223b">具身世界模型资源快照</text><text x="600" y="100" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#53627a">按仓库类型归档，并回到真实交互数据核验</text>
<g fill="#fff" stroke="#d3dceb" stroke-width="2"><rect x="72" y="170" width="440" height="150" rx="22"/><rect x="688" y="170" width="440" height="150" rx="22"/><rect x="72" y="390" width="440" height="150" rx="22"/><rect x="688" y="390" width="440" height="150" rx="22"/></g>
<g font-family="sans-serif"><text x="104" y="218" font-size="24" font-weight="700" fill="#175b9d">模型与权重</text><text x="104" y="256" font-size="17" fill="#334155">动作条件视频 · 潜在状态 · 分层预测</text><text x="104" y="285" font-size="15" fill="#68778c">核对模型版本、控制接口与训练来源</text>
<text x="720" y="218" font-size="24" font-weight="700" fill="#177458">数据集与评测</text><text x="720" y="256" font-size="17" fill="#334155">机器人轨迹 · 物理偏好 · 长时漂移</text><text x="720" y="285" font-size="15" fill="#68778c">核对动作标签、时序与切分方式</text>
<text x="104" y="438" font-size="24" font-weight="700" fill="#9b5b14">Space 演示</text><text x="104" y="476" font-size="17" fill="#334155">在线交互 · rollout 浏览 · 基准入口</text><text x="104" y="505" font-size="15" fill="#68778c">固定访问日、代码与模型 revision</text>
<text x="720" y="438" font-size="24" font-weight="700" fill="#7351a1">论文与项目来源</text><text x="720" y="476" font-size="17" fill="#334155">模型卡 · 关联论文 · 基础模型 · 数据卡</text><text x="720" y="505" font-size="15" fill="#68778c">沿来源关系理解实验条件和限制</text></g>
<circle cx="600" cy="355" r="56" fill="#192b49"/><text x="600" y="350" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">具身</text><text x="600" y="375" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">交互</text>
