<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">论文到数据契约的提炼链</title><desc id="desc">论文证据进入主题页，提炼观测与动作、对齐、标签、版本字段，再经质量检查用于训练和评估。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#356b8c"/></marker><style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#173042}.head{font-size:29px;font-weight:700}.sub{font-size:18px;fill:#536779}.label{font-size:21px;font-weight:700}.small{font-size:17px}.box{fill:#f5fafc;stroke:#6d9db7;stroke-width:2}.em{fill:#e3f1f7;stroke:#2f7294;stroke-width:2.5}.green{fill:#eef7ed;stroke:#6d9d72;stroke-width:2}.amber{fill:#fff6e4;stroke:#c79a4b;stroke-width:2}.line{stroke:#356b8c;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1200" height="500" rx="24" fill="#fffdf8"/><text x="60" y="62" class="head">从论文结论提炼可复用的数据知识</text><text x="60" y="95" class="sub">每个主题都回到可采集、可验证、可复用的数据对象</text><rect x="55" y="145" width="250" height="300" rx="18" class="box"/><text x="180" y="194" class="label" text-anchor="middle">论文证据</text><text x="85" y="239" class="small">• 原始摘要与正文</text><text x="85" y="279" class="small">• 方法所需的输入</text><text x="85" y="319" class="small">• 数据集与实验设置</text><text x="85" y="359" class="small">• 声称成立的条件</text><rect x="370" y="145" width="290" height="300" rx="18" class="em"/><text x="515" y="194" class="label" text-anchor="middle">知识点数据契约</text><text x="400" y="239" class="small">• 观测、状态与动作</text><text x="400" y="279" class="small">• 时间与空间坐标</text><text x="400" y="319" class="small">• 标签、来源与版本</text><text x="400" y="359" class="small">• episode 与 split</text><rect x="725" y="145" width="215" height="300" rx="18" class="green"/><text x="832" y="194" class="label" text-anchor="middle">质量检查</text><text x="755" y="239" class="small">• 缺失与同步</text><text x="755" y="279" class="small">• 物理合理性</text><text x="755" y="319" class="small">• 标签一致性</text><text x="755" y="359" class="small">• 泄漏与漂移</text><rect x="1005" y="145" width="160" height="300" rx="18" class="amber"/><text x="1085" y="194" class="label" text-anchor="middle">数据使用</text><text x="1025" y="239" class="small">• 训练</text><text x="1025" y="279" class="small">• 回放</text><text x="1025" y="319" class="small">• 留出评估</text><text x="1025" y="359" class="small">• 复现</text><path d="M305 295h65M660 295h65M940 295h65" class="line"/></svg>