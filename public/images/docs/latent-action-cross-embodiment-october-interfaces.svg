<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">跨本体对齐：三种接口不能混为一列</title><desc id="desc">左侧表示人类视频去除相机和节奏干扰，中间区分视觉潜在编码、控制器潜在命令与共享解剖坐标，右侧验证目标本体执行。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:650}.b{font-size:20px}.s{font-size:18px;fill:#475569}.white{font-size:20px;fill:white}</style><rect width="1120" height="660" rx="24" fill="#f8fafc"/><text x="40" y="56" class="t">跨本体对齐：三种接口不能混为一列</text><rect x="40" y="140" width="320" height="330" rx="18" fill="#dbeafe" stroke="#cbd5e1"/><text x="62" y="180" class="h">源视频与动作证据</text><text x="62" y="219" class="b">相机运动与手物运动</text><text x="62" y="251" class="b">原始帧对与时间间隔</text><text x="62" y="283" class="b">光流质量与遮挡</text><text x="62" y="315" class="b">接触事件独立检查</text><text x="62" y="347" class="b">频域处理版本</text><rect x="400" y="140" width="320" height="330" rx="18" fill="#ede9fe" stroke="#cbd5e1"/><text x="422" y="180" class="h">共享表示类型</text><text x="422" y="219" class="b">视觉潜在编码</text><text x="422" y="251" class="b">控制器潜在命令</text><text x="422" y="283" class="b">共享解剖关节坐标</text><text x="422" y="315" class="b">身体 / 手部分开标识</text><text x="422" y="347" class="b">编码与映射版本</text><rect x="760" y="140" width="320" height="330" rx="18" fill="#dcfce7" stroke="#cbd5e1"/><text x="782" y="180" class="h">目标机器人验证</text><text x="782" y="219" class="b">本体与自由度映射</text><text x="782" y="251" class="b">单位、限位与归一化</text><text x="782" y="283" class="b">解码器 / 控制器版本</text><text x="782" y="315" class="b">适配数据预算</text><text x="782" y="347" class="b">接触正确与闭环成功</text><path d="M365 300 L390 300" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M725 300 L750 300" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="40" y="520" width="1040" height="100" rx="18" fill="#ffedd5" stroke="#cbd5e1"/><text x="62" y="560" class="h">不可省略的来源链</text><text x="62" y="599" class="b">原视频 → 派生表示 → 本体映射 → 控制器 → 实际轨迹；缺失自由度不用零值冒充。</text></svg>