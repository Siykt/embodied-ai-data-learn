<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">具身记忆：对象、时间和证据链</title><desc id="desc">原始事件关联对象和实际时间，形成带证据来源的记忆，再经过查询、条目检索和定位供动作使用。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:650}.b{font-size:20px}.s{font-size:18px;fill:#475569}.white{font-size:20px;fill:white}</style><rect width="1120" height="660" rx="24" fill="#f8fafc"/><text x="40" y="56" class="t">具身记忆：对象、时间和证据链</text><text x="40" y="94" class="s">压缩历史之后，仍然能回到“何时何地、看见了什么”。</text><rect x="40" y="140" width="320" height="315" rx="18" fill="#dbeafe" stroke="#cbd5e1"/><text x="62" y="180" class="h">原始事件</text><text x="62" y="219" class="b">视频与接触短片</text><text x="62" y="251" class="b">帧范围 + 真实时间差</text><text x="62" y="283" class="b">对话与对象实例</text><text x="62" y="315" class="b">相机、对象位姿</text><text x="62" y="347" class="b">缺帧与遮挡标记</text><rect x="400" y="140" width="320" height="315" rx="18" fill="#ede9fe" stroke="#cbd5e1"/><text x="422" y="180" class="h">记忆记录</text><text x="422" y="219" class="b">对象条目 + 状态版本</text><text x="422" y="251" class="b">层级事件与父子关系</text><text x="422" y="283" class="b">实测 / 预测来源</text><text x="422" y="315" class="b">最后确认时间</text><text x="422" y="347" class="b">原始证据链接</text><rect x="760" y="140" width="320" height="315" rx="18" fill="#dcfce7" stroke="#cbd5e1"/><text x="782" y="180" class="h">检索与行动</text><text x="782" y="219" class="b">查询 → 候选条目</text><text x="782" y="251" class="b">正确对象是否召回</text><text x="782" y="283" class="b">位置是否可恢复</text><text x="782" y="315" class="b">动作是否使用历史</text><text x="782" y="347" class="b">任务收益与调用成本</text><path d="M364 295 L390 295" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M724 295 L750 295" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="40" y="520" width="1040" height="100" rx="18" fill="#ffedd5" stroke="#cbd5e1"/><text x="62" y="560" class="h">分开诊断三个错误位置</text><text x="62" y="599" class="b">记忆形成错误、检索错误、空间定位错误；问答正确不保证机器人能找到目标。</text></svg>