<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc"><title id="title">世界模型规划与决策评估：评估</title><desc id="desc">世界模型规划分别评估候选排序、闭环成功和实时计算成本</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6758a6" stroke-width="1.6"/></marker></defs>
<rect width="1000" height="280" rx="20" fill="#f3f8fc"/>
<text x="32" y="42" font-size="22" font-weight="700" fill="#17324d">世界模型规划与决策评估</text>
<text x="32" y="67" font-size="14" fill="#466178">分层检验，避免单一总分遮蔽失败模式</text>
<rect x="42" y="93" width="280" height="105" rx="16" fill="#fff" stroke="#6758a6" stroke-width="2"/><text x="182.0" y="131" text-anchor="middle" font-size="19" font-weight="700" fill="#17324d">排序质量</text><text x="182.0" y="162" text-anchor="middle" font-size="13" fill="#466178">选中动作是否更好</text><rect x="362" y="93" width="280" height="105" rx="16" fill="#fff" stroke="#6758a6" stroke-width="2"/><text x="502.0" y="131" text-anchor="middle" font-size="19" font-weight="700" fill="#17324d">闭环结果</text><text x="502.0" y="162" text-anchor="middle" font-size="13" fill="#466178">成功与恢复</text><rect x="682" y="93" width="280" height="105" rx="16" fill="#fff" stroke="#6758a6" stroke-width="2"/><text x="822.0" y="131" text-anchor="middle" font-size="19" font-weight="700" fill="#17324d">实时成本</text><text x="822.0" y="162" text-anchor="middle" font-size="13" fill="#466178">推理延迟与响应</text><path d="M 42 225 H 958" stroke="#6758a6" stroke-width="3"/><text x="500" y="251" text-anchor="middle" font-size="14" fill="#466178">逐场景、物体、机器人、时间段分层报告；保留失败样本</text>
</svg>
