<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 565" role="img" aria-labelledby="title desc"><title id="title">具身仿真技术的代表性发展节点</title><desc id="desc">2004 年 Gazebo 到 2020 年代 Isaac Lab 等代表节点，展示系统集成、接触控制、标准任务、迁移、离线数据与并行多传感器。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#326b8a"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#193547}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:17px}.line{stroke:#326b8a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1200" height="565" rx="24" fill="#fffdf8"/><text x="45" y="58" class="title">代表节点：需求推动新的设计层</text><path d="M85 285H1140" stroke="#6b97ad" stroke-width="5"/><circle cx="120" cy="285" r="10" fill="#326b8a"/><path d="M120 274V267M120 267V244" stroke="#326b8a" stroke-width="3"/><rect x="45" y="110" width="150" height="126" rx="14" fill="#f4fafc" stroke="#568da9" stroke-width="2"/><text x="120" y="142" text-anchor="middle" class="small">2004</text><text x="120" y="182" text-anchor="middle" class="label" font-size="20">Gazebo</text><text x="120" y="214" text-anchor="middle" class="small">系统集成</text><circle cx="285" cy="285" r="10" fill="#326b8a"/><path d="M285 296V349" stroke="#326b8a" stroke-width="3"/><rect x="210" y="350" width="150" height="126" rx="14" fill="#f4fafc" stroke="#568da9" stroke-width="2"/><text x="285" y="382" text-anchor="middle" class="small">2012</text><text x="285" y="422" text-anchor="middle" class="label" font-size="20">MuJoCo</text><text x="285" y="454" text-anchor="middle" class="small">接触控制</text><circle cx="450" cy="285" r="10" fill="#326b8a"/><path d="M450 274V267M450 267V244" stroke="#326b8a" stroke-width="3"/><rect x="375" y="110" width="150" height="126" rx="14" fill="#f4fafc" stroke="#568da9" stroke-width="2"/><text x="450" y="142" text-anchor="middle" class="small">2016</text><text x="450" y="182" text-anchor="middle" class="label" font-size="20">Gym</text><text x="450" y="214" text-anchor="middle" class="small">统一任务</text><circle cx="615" cy="285" r="10" fill="#326b8a"/><path d="M615 296V349" stroke="#326b8a" stroke-width="3"/><rect x="540" y="350" width="150" height="126" rx="14" fill="#f4fafc" stroke="#568da9" stroke-width="2"/><text x="615" y="382" text-anchor="middle" class="small">2017</text><text x="615" y="422" text-anchor="middle" class="label" font-size="20">随机化</text><text x="615" y="454" text-anchor="middle" class="small">真实迁移</text><circle cx="780" cy="285" r="10" fill="#326b8a"/><path d="M780 274V267M780 267V244" stroke="#326b8a" stroke-width="3"/><rect x="705" y="110" width="150" height="126" rx="14" fill="#f4fafc" stroke="#568da9" stroke-width="2"/><text x="780" y="142" text-anchor="middle" class="small">2020</text><text x="780" y="182" text-anchor="middle" class="label" font-size="20">D4RL</text><text x="780" y="214" text-anchor="middle" class="small">离线数据</text><circle cx="945" cy="285" r="10" fill="#326b8a"/><path d="M945 296V349" stroke="#326b8a" stroke-width="3"/><rect x="870" y="350" width="150" height="126" rx="14" fill="#f4fafc" stroke="#568da9" stroke-width="2"/><text x="945" y="382" text-anchor="middle" class="small">2021</text><text x="945" y="422" text-anchor="middle" class="label" font-size="20">Isaac Gym</text><text x="945" y="454" text-anchor="middle" class="small">GPU 并行</text><circle cx="1110" cy="285" r="10" fill="#326b8a"/><path d="M1110 274V267M1110 267V244" stroke="#326b8a" stroke-width="3"/><rect x="1035" y="110" width="150" height="126" rx="14" fill="#f4fafc" stroke="#568da9" stroke-width="2"/><text x="1110" y="142" text-anchor="middle" class="small">2020s</text><text x="1110" y="182" text-anchor="middle" class="label" font-size="20">Isaac Lab</text><text x="1110" y="214" text-anchor="middle" class="small">多传感器</text><text x="45" y="535" class="small">代表性节点可并存；时间线不表示新工具替代旧工具</text></svg>