<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">仿真数据学习路线</title>
  <desc id="desc">先在本地学习 MuJoCo 模型、轨迹和传感器对齐，再在受支持的 NVIDIA 环境中学习 Isaac Lab 并行任务、视觉策略和独立评估。每一阶段都以可检查的数据产物验收。</desc>
  <defs>
    <style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#173042}.title{font-size:29px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.card{fill:#fff;stroke:#9bb7c6;stroke-width:2}.line{fill:none;stroke:#467e99;stroke-width:3;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#467e99"/></marker>
  </defs>
  <rect width="1200" height="660" rx="24" fill="#fffdf8"/>
  <text x="48" y="59" class="title">从一条可回读轨迹，走向并行任务数据</text>
  <text x="48" y="92" class="body">每一步都保存配置、检查数据，再增加新的复杂度</text>
  <rect x="32" y="120" width="1136" height="219" rx="20" fill="#eaf4f8"/>
  <text x="55" y="155" class="head">本地 MuJoCo：模型与数据基础</text>
  <rect x="55" y="176" width="322" height="135" rx="14" class="card"/>
  <text x="76" y="212" class="head">1 · 单模型与步进</text>
  <text x="76" y="247" class="body">MJCF → 控制输入 → 状态变化</text>
  <text x="76" y="281" class="small">验收：时间、维度与数值正常</text>
  <path d="M383 243H416" class="line"/>
  <rect x="427" y="176" width="322" height="135" rx="14" class="card"/>
  <text x="448" y="212" class="head">2 · 状态与动作记录</text>
  <text x="448" y="247" class="body">时间 / qpos / qvel / ctrl</text>
  <text x="448" y="281" class="small">验收：轨迹能保存、回读和检查</text>
  <path d="M755 243H788" class="line"/>
  <rect x="799" y="176" width="345" height="135" rx="14" class="card"/>
  <text x="820" y="212" class="head">3 · 相机与传感器</text>
  <text x="820" y="247" class="body">图像、传感器与动作共用时间轴</text>
  <text x="820" y="281" class="small">验收：单位、坐标系和采样率明确</text>
  <path d="M972 312V356H224V392" class="line"/>
  <rect x="32" y="378" width="1136" height="200" rx="20" fill="#f1f4e9"/>
  <rect x="55" y="401" width="322" height="149" rx="14" class="card"/>
  <text x="76" y="437" class="head">4 · 任务与质量</text>
  <text x="76" y="471" class="body">成功、失败和结束原因</text>
  <text x="76" y="505" class="small">先隔离训练与评估分布</text>
  <text x="76" y="530" class="small">再比较数据质量与任务表现</text>
  <path d="M383 475H416" class="line"/>
  <rect x="427" y="401" width="322" height="149" rx="14" class="card"/>
  <text x="448" y="437" class="head">5 · Isaac Lab 并行任务</text>
  <text x="448" y="471" class="body">多环境 → 独立 episode</text>
  <text x="448" y="505" class="small">受支持的 NVIDIA 环境</text>
  <text x="448" y="530" class="small">Linux / Windows · 对应版本</text>
  <path d="M755 475H788" class="line"/>
  <rect x="799" y="401" width="345" height="149" rx="14" class="card"/>
  <text x="820" y="437" class="head">视觉策略与独立评估</text>
  <text x="820" y="471" class="body">状态教师 → 相机学生 → 验收</text>
  <text x="820" y="505" class="small">保存教师动作与重置样本来源</text>
  <text x="820" y="530" class="small">分别说明训练输入和部署输入</text>
  <text x="600" y="622" text-anchor="middle" class="body">贯穿全程：代码与资产版本 · 采样时序 · 动作语义 · 许可 · 质量报告</text>
</svg>
