<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">浏览器遥操作具身数据流</title>
  <desc id="desc">贡献者在浏览器中输入控制意图，经过控制映射作用于仿真或机器人，观测和动作确认进入轨迹记录，再由任务验收反馈闭环。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356ae6"/></marker>
    <style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#172033}.h{font-size:23px;font-weight:700}.s{font-size:17px}.b{fill:#f7f9fc;stroke:#aebbd2;stroke-width:3}.a{fill:#eaf1ff;stroke:#356ae6;stroke-width:3}.q{fill:#fff7e6;stroke:#d28b24;stroke-width:3}.g{fill:#edf8f2;stroke:#3b9b68;stroke-width:3}</style>
  </defs>
  <rect width="1280" height="520" fill="#fff"/>
  <rect x="35" y="130" width="185" height="190" rx="16" class="b"/><text x="127" y="180" text-anchor="middle" class="h">贡献者输入</text><text x="127" y="220" text-anchor="middle" class="s">鼠标 / 手柄 / 触控</text><text x="127" y="254" text-anchor="middle" class="s">客户端事件时间</text><text x="127" y="288" text-anchor="middle" class="s">UI 版本</text>
  <rect x="270" y="130" width="185" height="190" rx="16" class="a"/><text x="362" y="180" text-anchor="middle" class="h">控制映射</text><text x="362" y="220" text-anchor="middle" class="s">坐标系与单位</text><text x="362" y="254" text-anchor="middle" class="s">限幅 / 安全检查</text><text x="362" y="288" text-anchor="middle" class="s">请求动作</text>
  <rect x="505" y="130" width="185" height="190" rx="16" class="g"/><text x="597" y="180" text-anchor="middle" class="h">环境执行</text><text x="597" y="220" text-anchor="middle" class="s">仿真器或机器人</text><text x="597" y="254" text-anchor="middle" class="s">设备 / 仿真时钟</text><text x="597" y="288" text-anchor="middle" class="s">实际应用动作</text>
  <rect x="740" y="130" width="185" height="190" rx="16" class="b"/><text x="832" y="180" text-anchor="middle" class="h">观测与确认</text><text x="832" y="220" text-anchor="middle" class="s">图像 / 本体状态</text><text x="832" y="254" text-anchor="middle" class="s">动作状态与延迟</text><text x="832" y="288" text-anchor="middle" class="s">对齐质量标记</text>
  <rect x="975" y="130" width="185" height="190" rx="16" class="q"/><text x="1067" y="180" text-anchor="middle" class="h">轨迹与验收</text><text x="1067" y="220" text-anchor="middle" class="s">episode 落盘</text><text x="1067" y="254" text-anchor="middle" class="s">任务结果 / 质检</text><text x="1067" y="288" text-anchor="middle" class="s">训练 / 评估准入</text>
  <path d="M220 225H260M455 225H495M690 225H730M925 225H965" stroke="#356ae6" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1060 330C930 470 360 470 125 330" fill="none" stroke="#7d8ba6" stroke-width="3" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <text x="590" y="420" text-anchor="middle" class="s">验收结果与质量反馈影响下一轮任务分配、审核和采集策略</text>
  <text x="640" y="70" text-anchor="middle" class="h">浏览器遥操作采集闭环</text>
</svg>
