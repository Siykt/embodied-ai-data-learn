<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">世界坐标中的运动与交互语境</title>
<desc id="desc">联合重建手和相机时保存尺度、可见性及标注来源，场景中的表面和目的地标签与运动相连，同时避免将生成补全误作测量。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs>
<rect width="1200" height="590" rx="20" fill="#f8fafc"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="44" y="51" font-size="28" font-weight="700" fill="#0f172a">世界坐标中的运动与交互语境</text>
<text x="44" y="83" font-size="16" fill="#475569">2026 年 10 月 · 数据组织示意 · 字段及验收为本站建议</text>
<rect x="40" y="115" width="340" height="326" rx="14" fill="white" stroke="#cbd5e1"/>
<rect x="40" y="115" width="340" height="61" rx="14" fill="#0f766e"/>
<text x="60" y="154" font-size="23" font-weight="650" fill="white">01 联合运动</text>
<text x="60" y="211" font-size="19" font-weight="600" fill="#0f766e">手与相机共同估计</text>
<circle cx="63" cy="252" r="4" fill="#0f766e"/>
<text x="78" y="258" font-size="18" fill="#1e293b">双手姿态 / 手出现</text>
<circle cx="63" cy="295" r="4" fill="#0f766e"/>
<text x="78" y="301" font-size="18" fill="#1e293b">相机运动 / 焦距来源</text>
<circle cx="63" cy="338" r="4" fill="#0f766e"/>
<text x="78" y="344" font-size="18" fill="#1e293b">伪标签与高精度标注</text>
<circle cx="63" cy="381" r="4" fill="#0f766e"/>
<text x="78" y="387" font-size="18" fill="#1e293b">共同世界坐标</text>
<line x1="389" y1="285" x2="418" y2="285" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="430" y="115" width="340" height="326" rx="14" fill="white" stroke="#cbd5e1"/>
<rect x="430" y="115" width="340" height="61" rx="14" fill="#1d4ed8"/>
<text x="450" y="154" font-size="23" font-weight="650" fill="white">02 几何验收</text>
<text x="450" y="211" font-size="19" font-weight="600" fill="#1d4ed8">尺度与遮挡分别检查</text>
<circle cx="453" cy="252" r="4" fill="#1d4ed8"/>
<text x="468" y="258" font-size="18" fill="#1e293b">米制监督 / 尺度锚点</text>
<circle cx="453" cy="295" r="4" fill="#1d4ed8"/>
<text x="468" y="301" font-size="18" fill="#1e293b">可见 / 遮挡 / 出画</text>
<circle cx="453" cy="338" r="4" fill="#1d4ed8"/>
<text x="468" y="344" font-size="18" fill="#1e293b">观测与生成补全分开</text>
<circle cx="453" cy="381" r="4" fill="#1d4ed8"/>
<text x="468" y="387" font-size="18" fill="#1e293b">世界误差 + 覆盖率</text>
<line x1="779" y1="285" x2="808" y2="285" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="820" y="115" width="340" height="326" rx="14" fill="white" stroke="#cbd5e1"/>
<rect x="820" y="115" width="340" height="61" rx="14" fill="#7e22ce"/>
<text x="840" y="154" font-size="23" font-weight="650" fill="white">03 交互语境</text>
<text x="840" y="211" font-size="19" font-weight="600" fill="#7e22ce">轨迹进入完整场景</text>
<circle cx="843" cy="252" r="4" fill="#7e22ce"/>
<text x="858" y="258" font-size="18" fill="#1e293b">房间 / 表面稳定 ID</text>
<circle cx="843" cy="295" r="4" fill="#7e22ce"/>
<text x="858" y="301" font-size="18" fill="#1e293b">携物起点与目的地</text>
<circle cx="843" cy="338" r="4" fill="#7e22ce"/>
<text x="858" y="344" font-size="18" fill="#1e293b">语言上下文独立保存</text>
<circle cx="843" cy="381" r="4" fill="#7e22ce"/>
<text x="858" y="387" font-size="18" fill="#1e293b">可供性连接两类监督</text>
<rect x="40" y="468" width="1120" height="89" rx="12" fill="#e2e8f0"/>
<text x="61" y="503" font-size="20" font-weight="600" fill="#0f172a">评估拆分：手位置误差 / 相机尺度 / 场景碰撞 / 语境目的地</text>
<text x="61" y="535" font-size="18" fill="#334155">留出：场景与来源视频；不要用逐帧尺度拟合掩盖世界轨迹漂移</text>
</g></svg>
